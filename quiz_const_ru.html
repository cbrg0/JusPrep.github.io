<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конституционное право — Тест</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Open Sans', sans-serif;
      background: #f4f6fa;
      margin: 0;
      color: #222;
    }
    header {
      background: #0a3161;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    main {
      max-width: 700px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; margin-bottom: 1rem; }
    .question { font-weight: bold; margin-top: 1rem; }
    .options label {
      display: block;
      background: #eef2f8;
      margin: 0.4rem 0;
      padding: 0.6rem;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    .options input { margin-right: 10px; }
    .options label:hover { background: #dce6f5; }
    button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 10px;
      background: #0a3161;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #124ca1; }
    .result { text-align: center; margin-top: 2rem; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <a href="quizzes.html"><i class="fas fa-arrow-left"></i> Назад</a>
    <div>JusPrep</div>
  </header>

  <main>
    <h1>Конституционное право</h1>
    <p style="text-align:center;">Мини-тест по Конституции Республики Казахстан</p>

    <div id="quiz"></div>
    <button id="nextBtn">Далее</button>
    <div class="result" id="result"></div>
  </main>

  <script>
    const quizData = [
      {
        question: "1. Что такое государство?",
        options: [
          "A) Общество, проживающее на определённой территории и имеющее аппарат управления",
          "B) Совокупность правовых норм",
          "C) Организация, созданная для достижения общественных целей",
          "D) Территориальная структура на основе исторического расселения",
          "E) Правовая форма объединения граждан"
        ],
        correct: 0
      },
      {
        question: "2. Что такое Конституция?",
        options: [
          "A) Основной закон государства",
          "B) Любой закон, принятый Парламентом",
          "C) Указ Президента",
          "D) Международный договор",
          "E) Правительственное постановление"
        ],
        correct: 0
      },
      {
        question: "3. Срок полномочий членов Конституционного Совета:",
        options: ["A) 6 лет", "B) 2 года", "C) 5 лет", "D) 3 года", "E) 7 лет"],
        correct: 0
      },
      {
        question: "4. Кто назначает Председателя Конституционного Совета?",
        options: ["A) Президент", "B) Правительство", "C) Парламент", "D) Маслихат", "E) Аким"],
        correct: 0
      },
      {
        question: "5. Сколько человек входит в Конституционный Совет?",
        options: ["A) 7", "B) 5", "C) 6", "D) 8", "E) 9"],
        correct: 0
      },
      {
        question: "6. Кто имеет право быть пожизненным членом Конституционного Совета?",
        options: ["A) Экс-Президент", "B) Действующий Президент", "C) Председатель Парламента", "D) Премьер-министр", "E) Генеральный прокурор"],
        correct: 0
      },
      {
        question: "7. Статус казахского и русского языков:",
        options: ["A) Казахский — государственный, русский — официальный", "B) Оба официальные", "C) Оба государственные", "D) Казахский — государственный, русский — межнациональный", "E) Казахский — национальный, русский — официальный"],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const quiz = document.getElementById("quiz");
    const nextBtn = document.getElementById("nextBtn");
    const result = document.getElementById("result");

    function loadQuestion() {
      const q = quizData[currentQuestion];
      quiz.innerHTML = `
        <div class="question">${q.question}</div>
        <div class="options">
          ${q.options
            .map((opt, i) => `<label><input type="radio" name="q" value="${i}"> ${opt}</label>`)
            .join("")}
        </div>`;
    }

    nextBtn.addEventListener("click", () => {
      const answer = document.querySelector('input[name="q"]:checked');
      if (!answer) return alert("Выберите ответ!");
      if (parseInt(answer.value) === quizData[currentQuestion].correct) score++;
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        quiz.innerHTML = "";
        nextBtn.style.display = "none";
        result.innerHTML = `Ваш результат: ${score} / ${quizData.length}`;
      }
    });

    loadQuestion();
  </script>

</body>
</html>
