<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Азаматтық құқық — JusPrep</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .quiz-container { max-width: 800px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .question { font-weight: 600; margin-bottom: 10px; }
    .options label { display: block; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .options label:hover { background: #f0f8ff; }
    .btn { display: inline-block; padding: 10px 20px; background: #002b5c; color: #fff; border-radius: 8px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #004080; }
    #resultBox { margin-top: 30px; background: #f8f9fa; padding: 20px; border-radius: 10px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>

<header class="header container">
  <div class="logo"><a href="index.html" style="color:white;text-decoration:none;">JusPrep</a></div>
  <nav class="nav">
    <ul>
      <li><a href="index.html">Басты бет</a></li>
      <li><a href="materials.html">Материалдар</a></li>
      <li><a href="materials.html#cases">НҚА & Істер</a></li>
      <li><a href="quizzes.html">Викториналар</a></li>
      <li><a href="tests.html">Олимпиадалық тапсырмалар</a></li>
      <li><a href="index.html#news">Жаңалықтар</a></li>
    </ul>
  </nav>
  <button id="loginBtn" class="login-circle"><i class="fas fa-user"></i></button>
</header>

<section class="hero container">
  <h1>Азаматтық құқық</h1>
  <p>Азаматтық-құқықтық қатынастар бойынша мини-тест</p>
</section>

<main class="container">
  <div class="quiz-container">
    <div id="quizBox"></div>
    <button class="btn" id="nextBtn">Келесі</button>
    <div id="resultBox">
      <h2>Нәтижелер</h2>
      <p id="score"></p>
      <table id="answerTable"></table>
    </div>
  </div>
</main>

<footer class="footer container">
  <p>© 2025 JusPrep</p>
</footer>

<script>
const quizData = [
  {
    question: "1. Азаматтық құқықтар мен міндеттердің пайда болу негізі не болып табылады?",
    options: ["A) Шарттар мен өзге де мәмілелер", "B) Тек әкімшілік актілер", "C) Адамгершілік нормалары", "D) Сот шешімдері"],
    correct: 0
  },
  {
    question: "2. Азаматтық құқық объектілеріне не жатады?",
    options: ["A) Мүлік, ақша, зияткерлік қызмет нәтижелері", "B) Тек жылжымайтын мүлік", "C) Тек материалдық заттар", "D) Тек қызметтер"],
    correct: 0
  },
  {
    question: "3. Азаматтық құқық субъектісі кім болып табылады?",
    options: ["A) Азаматтар, заңды тұлғалар және мемлекет", "B) Тек жеке тұлғалар", "C) Тек ұйымдар", "D) Тек мемлекеттік органдар"],
    correct: 0
  },
  {
    question: "4. Азаматтық құқықтағы мәміле дегеніміз не?",
    options: ["A) Азаматтар мен заңды тұлғалардың құқықтар мен міндеттерді белгілеуге, өзгертуге немесе тоқтатуға бағытталған әрекеттері", "B) Тек ауызша келісім", "C) Сот шешімі", "D) Кез келген заңдық оқиға"],
    correct: 0
  },
  {
    question: "5. Азаматтың құқық қабілеттілігі қашан пайда болады?",
    options: ["A) Туған сәтінен бастап", "B) 18 жастан бастап", "C) Паспорт алған сәттен бастап", "D) Мектепті бітіргеннен кейін"],
    correct: 0
  },
  {
    question: "6. Қазақстан Республикасындағы меншік нысандары:",
    options: ["A) Мемлекеттік, жеке және өзге де нысандар", "B) Тек жеке меншік", "C) Тек мемлекеттік меншік", "D) Коммуналдық меншік"],
    correct: 0
  },
  {
    question: "7. Азаматтық құқық нені реттейді?",
    options: ["A) Мүліктік және мүліктік емес жеке қатынастарды", "B) Саяси қатынастарды", "C) Қылмыстық қатынастарды", "D) Әкімшілік дауларды"],
    correct: 0
  },
  {
    question: "8. Міндеттеме дегеніміз не?",
    options: ["A) Бір тұлға басқа тұлғаның пайдасына белгілі бір әрекет жасауға міндетті болатын құқықтық қатынас", "B) Жеке уәде", "C) Сот шешімі", "D) Заң"],
    correct: 0
  },
  {
    question: "9. Шартқа кімдер қатыса алады?",
    options: ["A) Әрбір әрекетке қабілетті азамат және ұйымдар", "B) Тек азаматтар", "C) Тек заңды тұлғалар", "D) Тек мемлекеттік органдар"],
    correct: 0
  },
  {
    question: "10. Азаматтық кодекспен не реттеледі?",
    options: ["A) Азаматтық заңнаманың негізгі ережелері", "B) Тек қылмыстық нормалар", "C) Саяси жүйе", "D) Сот тәжірибесі"],
    correct: 0
  }
];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const resultBox = document.getElementById("resultBox");
const scoreDisplay = document.getElementById("score");
const answerTable = document.getElementById("answerTable");

function loadQuestion() {
  const q = quizData[currentQuestion];
  quizBox.innerHTML = `
    <div class="question">${q.question}</div>
    <div class="options">
      ${q.options.map((opt, i) => `<label><input type="radio" name="answer" value="${i}"> ${opt}</label>`).join("")}
    </div>
  `;
}
loadQuestion();

nextBtn.addEventListener("click", () => {
  const answer = document.querySelector('input[name="answer"]:checked');
  if (!answer) return alert("Жауапты таңдаңыз!");
  const selected = parseInt(answer.value);
  userAnswers.push(selected);
  if (selected === quizData[currentQuestion].correct) score++;
  currentQuestion++;
  if (currentQuestion < quizData.length) {
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  quizBox.style.display = "none";
  nextBtn.style.display = "none";
  resultBox.style.display = "block";

  scoreDisplay.textContent = `Сіздің нәтижеңіз: ${score} / ${quizData.length}`;
  let tableHTML = "<tr><th>Сұрақ</th><th>Жауабыңыз</th><th>Статус</th></tr>";
  quizData.forEach((q, i) => {
    const correct = i < userAnswers.length && userAnswers[i] === q.correct;
    tableHTML += `<tr><td>${q.question}</td><td>${q.options[userAnswers[i]] || "—"}</td><td>${correct ? "✅" : "❌"}</td></tr>`;
  });
  answerTable.innerHTML = tableHTML;

  localStorage.setItem("civilLawScoreKZ", score);
}
</script>

</body>
</html>
