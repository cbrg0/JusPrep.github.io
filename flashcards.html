<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JusPrep — Flashcards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #3b82f6;
      --gold-2: #ca8a04;
      --gold-light: #fefce8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      scroll-behavior: smooth;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 32px 56px 56px;
      position: relative;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
    }

    /* HEADER */
    header {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 0 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02);
      position: sticky;
      top: 20px;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--primary);
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%);
      display: grid;
      place-items: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* LANGUAGE SWITCHER */
    .lang-switcher {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      background: transparent;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(30, 58, 138, 0.2);
    }

    .btn {
      height: 40px;
      padding: 0 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-outline {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    /* HERO */
    .top-banner {
      padding: 10px 4px 30px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .top-banner h1 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.1;
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* BLOCKS GRID */
    .blocks-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      width: 100%;
      margin-bottom: 50px;
    }

    @media (max-width: 1200px) {
      .blocks-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .blocks-grid { grid-template-columns: 1fr; gap: 16px; margin-bottom: 30px; }
      .page { padding: 12px 16px 32px; }
      header {
        height: 64px;
        padding: 0 16px;
        top: 10px;
        margin-bottom: 20px;
        border-radius: 16px;
      }
      .logo { font-size: 22px; gap: 10px; }
      .logo-mark { width: 34px; height: 34px; font-size: 16px; border-radius: 10px; }
      .btn { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
      .top-banner { flex-direction: column; align-items: flex-start; gap: 12px; padding: 5px 2px 15px; }
      .top-banner h1 { font-size: 28px; }
    }

    .block-card {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
      transition: all .4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.04);
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .block-card {
        padding: 22px 18px;
        min-height: auto;
        border-radius: 18px;
      }
    }

    .block-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      opacity: 0.8;
      transition: height 0.3s ease;
    }

    .block-card:hover {
      border-color: rgba(30, 58, 138, 0.4);
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -15px rgba(30, 58, 138, 0.12);
    }

    .block-card:hover::before {
      height: 10px;
    }

    .block-top {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .block-badge {
      align-self: flex-start;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .block-card h3 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--primary);
      line-height: 1.35;
    }

    @media (max-width: 640px) {
      .block-card h3 { font-size: 17px; }
    }

    .block-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
      font-weight: 800;
      font-size: 15px;
      margin-top: 24px;
      cursor: pointer;
      transition: gap 0.25s ease, color 0.25s ease;
    }

    .block-card:hover .block-action {
      gap: 16px;
      color: var(--accent);
    }

    /* STUDY MODAL */
    .study-modal {
      display: none;
      position: fixed;
      z-index: 3000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease;
    }

    .study-container {
      position: relative;
      background: #ffffff;
      width: 95%;
      max-width: 820px;
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3);
      animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-height: 95vh;
    }

    @media (max-width: 640px) {
      .study-container {
        width: 100%;
        height: 100%;
        max-height: 100vh;
        border-radius: 0;
      }
    }

    .study-header {
      background: var(--primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 36px;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .study-header { padding: 16px 20px; }
      .study-header h3 { font-size: 16px; line-height: 1.3; }
    }

    .study-header h3 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .close-study {
      font-size: 28px;
      cursor: pointer;
      color: white;
      opacity: 0.8;
      transition: 0.2s;
    }

    .close-study:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .flashcard-stage {
      padding: 50px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      user-select: none;
      perspective: 1200px;
      flex: 1;
      overflow-y: auto;
    }

    @media (max-width: 640px) {
      .flashcard-stage { padding: 20px 16px; min-height: 320px; }
    }

    .flashcard {
      width: 100%;
      height: 340px;
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      border: 2px solid var(--border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 45px;
      text-align: center;
      cursor: grab;
      position: relative;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, opacity 0.35s ease;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08);
      touch-action: pan-y;
      will-change: transform;
    }

    @media (max-width: 640px) {
      .flashcard {
        height: 100%;
        min-height: 280px;
        padding: 24px 18px;
        border-radius: 20px;
      }
    }

    .flashcard:active {
      cursor: grabbing;
    }

    .flashcard:hover {
      border-color: var(--accent);
      box-shadow: 0 25px 50px -10px rgba(30, 58, 138, 0.12);
    }

    .flashcard.swiping-left {
      transform: translateX(-220px) rotate(-14deg) scale(0.95);
      opacity: 0;
      border-color: var(--danger);
    }

    .flashcard.swiping-right {
      transform: translateX(220px) rotate(14deg) scale(0.95);
      opacity: 0;
      border-color: var(--success);
    }

    .flashcard-content {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.6;
      letter-spacing: -0.01em;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-height: 100%;
      overflow-y: auto;
      width: 100%;
    }

    @media (max-width: 640px) {
      .flashcard-content { font-size: 17px; line-height: 1.45; }
    }

    .flashcard-hint {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      background: var(--bg);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .flashcard-hint { bottom: 12px; font-size: 10px; padding: 4px 10px; }
    }

    .study-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 36px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .study-footer {
        padding: 14px 16px;
        gap: 8px;
      }
    }

    .action-btn {
      height: 52px;
      padding: 0 28px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
    }

    @media (max-width: 640px) {
      .action-btn {
        height: 44px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 12px;
        gap: 6px;
        flex: 1;
        justify-content: center;
      }
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .btn-again {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-again:hover {
      background: var(--danger);
      color: white;
    }

    .btn-learned {
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .btn-learned:hover {
      background: var(--success);
      color: white;
    }

    .card-counter {
      font-weight: 800;
      font-size: 16px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
      padding: 10px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .card-counter {
        padding: 8px 10px;
        font-size: 12px;
        border-radius: 10px;
      }
    }

    /* COMPLETION MODAL STYLES */
    .completion-modal {
      display: none;
      position: fixed;
      z-index: 4000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease;
      padding: 16px;
    }

    .completion-card {
      background: #ffffff;
      width: 90%;
      max-width: 440px;
      border-radius: 32px;
      padding: 40px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3);
      animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .completion-card {
        padding: 28px 20px;
        border-radius: 24px;
      }
    }

    .completion-icon {
      font-size: 56px;
      margin-bottom: 20px;
      animation: bounce 0.6s ease infinite alternate;
    }

    .completion-card h2 {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .completion-card p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .completion-btn {
      width: 100%;
      height: 52px;
      background: var(--primary);
      color: white;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.3);
    }

    .completion-btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    footer {
      width: 100%;
      margin-top: auto;
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      footer { padding-top: 20px; font-size: 12px; }
    }
  </style>
</head>

<body>

<div class="page">
  <header>
    <a href="index.html" class="logo">
      <div class="logo-mark">⚖</div>
      <span>JusPrep</span>
    </a>
    <div class="header-actions">
      <div class="lang-switcher">
        <button class="lang-btn active" id="langRuBtn">RU</button>
        <button class="lang-btn" id="langKzBtn">KZ</button>
      </div>
      <a href="index.html" class="btn btn-outline" id="navHomeBtn">
        <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> <span id="lblHome">На главную</span>

  <main>
    <div class="top-banner">
      <div>
        <h1 id="pageTitle">Flashcards</h1>

    <div class="blocks-grid" id="blocksContainer"></div>

  <footer>

  </footer>
</div>

<div class="study-modal" id="studyModal">

    <div class="study-header">
      <h3 id="modalBlockTitle">Название блока</h3>

    <div class="flashcard-stage">

    <div class="study-footer">

  </div>
</div>

<div class="completion-modal" id="completionModal">

    <div class="completion-icon">🔥</div>
    <h2 id="completionTitle">Все карточки усвоены</h2>
    <p id="completionDesc">Великолепный результат! Вы успешно прошли все термины этого блока.</p>
    <button class="completion-btn" id="completionCloseBtn">Отлично</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

  // Если у вас уже инициализирован быстрый доступ или пустой конфиг, оборачиваем в безопасный блок

      btnContinue: "Оқуды жалғастыру",

      btnLearned: "Мемгерілді",
      cardCounterPrefix: "Қалды:",
      completionTitle: "Барлық карточкалар игерілді",

    }

  // МАТЕРИАЛЫ КАРТОЧЕК С ДВУЯЗЫЧНЫМ ПЕРЕВОДОМ ПО ЗАКОНОДАТЕЛЬСТВУ РК
  const flashcardBlocksData = {
    ru: [
      {
        id: 1,
        title: "Блок 1: Теория государства и права и конституционный строй РК",
        cards: [
          { term: "Нормативный правовой акт (НПА)", definition: "Письменный официальный документ установленной формы, принятый на референдуме либо уполномоченным органом или должностным лицом государства, устанавливающий нормы права, изменяющий, прекращающий или приостанавливающий их действие." },
          { term: "Подзаконный актовый ряд (Подзаконный акт)", definition: "НПА, издаваемый на основе и во исполнение законов и не противоречащий им." },
          { term: "Юридическая коллизия", definition: "Расхождение или противоречие между различными нормативными правовыми актами, регулирующими одни и те же общественные отношения." },
          { term: "Инкорпорация права", definition: "Способ систематизации законодательства путем объединения НПА в сборники без изменения их содержания." },
          { term: "Кодификация права", definition: "Способ систематизации законодательства путем переработки норм права и создания нового единого кодифицированного акта (кодекса)." },
          { term: "Делегированное законодательство", definition: "Издание правительством или иным органом актов, имеющих силу закона, на основе временного наделения его такими полномочиями парламентом." },
          { term: "Трансформация норм права", definition: "Способ реализации международно-правовых норм путем их официального перевода в национальное законодательство." },
          { term: "Рецепция права", definition: "Заимствование государством чужой правовой системы (полное или частичное восприятие принципов римского или англосаксонского права)." },
          { term: "Деликтоспособность", definition: "Способность лица нести юридическую ответственность за совершенное правонарушение." },
          { term: "Правосубъектность", definition: "Способность лица быть участником (субъектом) правоотношений, слагающаяся из правоспособности и дееспособности." },
          { term: "Императивная норма", definition: "Строго обязательное предписание закона, не допускающее отступлений по соглашению сторон." },
          { term: "Диспозитивная норма", definition: "Норма, действующая постольку, поскольку соглашением сторон не установлено иное (разрешающую автономию воли)." },
          { term: "Преюдиция", definition: "Освобождение от доказывания обстоятельств, ранее установленных вступившим в законную силу судебным решением по другому делу." },
          { term: "Ретроактивность закона (Обратная сила)", definition: "Распространение действия закона на юридические факты и отношения, возникшие до его вступления в силу (в РК допускается только в случаях, когда это прямо смягчает или отменяет ответственность)." },
          { term: "Аналогия закона", definition: "Применение к неурегулированному спорному отношению нормы права, регулирующей сходные отношения." }
        ]
      },
      {
        id: 2,
        title: "Блок 2: Гражданское, обязательственное и вещное право РК",
        cards: [
          { term: "Виндикационный иск", definition: "Иск собственника об истребовании своего имущества из чужого незаконного владения." },
          { term: "Негаторный иск", definition: "Иск об устранении препятствий в осуществлении прав собственника, не связанных с лишением владения." },
          { term: "Конкуренция исков", definition: "Наличие у кредитора возможности предъявить к должнику несколько различных материально-правовых требований на выбор." },
          { term: "Эвикция", definition: "Изъятие имущества у покупателя по решению суда по основаниям, возникшим до исполнения договора купли-продажи (требования третьих лиц)." },
          { term: "Новация", definition: "Соглашение сторон о замене первоначального обязательства, существовавшего между ними, другим обязательством с иным предметом или способом исполнения." },
          { term: "Цессия", definition: "Уступка права требования (переход прав кредитора к другому лицу)." },
          { term: "Перевод долга", definition: "Замена должника в обязательстве другим лицом, допускаемая только с согласия кредитора." },
          { term: "Сингулярное правопреемство", definition: "Переход прав и обязанностей по отдельным обязательствам к конкретному лицу (например, по договору цессии)." },
          { term: "Универсальное правопреемство", definition: "Переход всей совокупности прав и обязанностей умершего лица к его наследникам (или при реорганизации юридического лица)." },
          { term: "Реституция", definition: "Возврат сторонами всего полученного по недействительной сделке в первоначальное имущественное положение." },
          { term: "Офферта", definition: "Адресованное одному или нескольким конкретным лицам предложение, которое достаточно определенно и выражает намерение лица, сделавшего предложение, считать себя заключившим договор с адресатом." },
          { term: "Акцепт", definition: "Ответ лица, которому адресована оферта, о ее принятии." },
          { term: "Задаток", definition: "Денежная сумма, выдаваемая одной стороной в счет причитающихся с нее по договору платежей другой стороне в доказательство заключения договора и в обеспечение его исполнения." },
          { term: "Неосновательное обогащение", definition: "Имущество, приобретенное или сбереженное за счет другого лица без установленных законодательством или сделкой оснований." },
          { term: "Факторинг", definition: "Финансирование под уступку денежного требования (договор финансирования под уступку денежного требования)." }
        ]
      },
      {
        id: 3,
        title: "Блок 3: Предпринимательское, налоговое и финансовое право РК",
        cards: [
          { term: "Аффилиированные лица", definition: "Физические и юридические лица, способные оказывать влияние на деятельность осуществляющих предпринимательскую деятельность юридических и (или) физических лиц." },
          { term: "Консолидированная группа налогоплательщиков", definition: "Добровольное объединение налогоплательщиков на основе договора о создании группы в целях исчисления и уплаты корпоративного подоходного налога." },
          { term: "Трансфертное ценообразование", definition: "Применение цены сделки, отличающейся от рыночной цены, в целях минимизации налогооблагаемой базы." },
          { term: "Бенефициарный собственник", definition: "Физическое лицо, которому прямо или косвенно принадлежит более 25 процентов акций или доли участия в уставном капитале юридического лица." },
          { term: "Субсидиарная ответственность", definition: "Дополнительная ответственность лиц, которые наряду с должником отвечают перед кредитором за исполнение обязательства в случаях, предусмотренных законом или договором." },
          { term: "Дочерняя организация", definition: "Юридическое лицо, решения которого определяются другим юридическим лицом (основной организацией) в силу преобладающего участия в уставном капитале." },
          { term: "Венчурное финансирование", definition: "Финансирование инновационных предприятий и проектов, сопряженное с высоким уровнем риска." },
          { term: "Резидентство", definition: "Юридическая связь физического или юридического лица с государством, определяющая объем его налоговых и иных обязательств." },
          { term: "Лицензиат", definition: "Физическое или юридическое лицо, получившее лицензию на осуществление определенного вида деятельности." },
          { term: "Дефолт", definition: "Неисполнение должником своих обязательств по выплате основного долга и процентов по долговым ценным бумагам или кредитным договорам." },
          { term: "Инсайдерская информация", definition: "Точная и нераспространенная финансовая, коммерческая или иная информация, раскрытие которой может оказать существенное влияние на стоимость ценных бумаг." },
          { term: "Санация", definition: "Система мер, осуществляемых для предотвращения банкротства и финансового оздоровления предприятия." },
          { term: "Ликвидационная масса", definition: "Имущество банкрота, за счет которого удовлетворяются требования кредиторов в процессе ликвидации." },
          { term: "Картельный сговор", definition: "Запрещенное антимонопольным законодательством соглашение между конкурентами об установлении цен, разделе рынков или ограничении объемов производства." },
          { term: "Презумпция невиновности налогоплательщика", definition: "Принцип, согласно которому все неустранимые сомнения в налоговом законодательстве толкуются в пользу налогоплательщика." }
        ]
      },
      {
        id: 4,
        title: "Блок 4: Уголовное и уголовно-процессуальное право РК",
        cards: [
          { term: "Эксцесс исполнителя", definition: "Совершение исполнителем преступления деяния, не охватывающегося умыслом других соучастников (организатора, пособника, подстрекателя)." },
          { term: "Реквизиция", definition: "Изъятие имущества у собственника в случаях стихийных бедствий, эпидемий и иных чрезвычайных ситуациях по решению государственных органов в порядке и на условиях, установленных законом, с выплатой стоимости имущества." },
          { term: "Рецидив преступлений", definition: "Совершение умышленного преступления лицом, имеющим судимость за ранее совершенное умышленное преступление." },
          { term: "Необходимая оборона", definition: "Правомерная защита личности, жилища, собственности и других интересов от общественно опасного посягательства путем причинения вреда посягающему." },
          { term: "Крайняя необходимость", definition: "Причинение вреда правоохраняемым интересам для устранения опасности, непосредственно грозящей лицу или правам данного лица, если эту опасность нельзя было устранить иными средствами." },
          { term: "Презумпция невиновности (УПК)", definition: "Каждый считается невиновным до тех пор, пока его виновность в совершении уголовного правонарушения не будет доказана в предусмотренном законом порядке и установлена вступившим в законную силу приговором суда." },
          { term: "Объективная истина", definition: "Всестороннее, полное и объективное исследование обстоятельств уголовного дела, устанавливаемое в ходе процесса." },
          { term: "Процессуальное соглашение", definition: "Соглашение между прокурором и подозреваемым/обвиняемым о признании вины или заключении сделки о сотрудничестве." },
          { term: "Иммунитет свидетельский", definition: "Законное право лица отказываться от дачи показаний против самого себя, близких родственников и супруга." },
          { term: "Нон-би-ин-дем (Ne bis in idem)", definition: "Принцип недопустимости повторного привлечения к уголовной ответственности за одно и то же правонарушение." },
          { term: "Конфискация имущества", definition: "Принудительное безвозмездное изъятие в собственность государства имущества, добытого преступным путем либо приобретенного на средства, добытые преступным путем." },
          { term: "Деятельное раскаяние", definition: "Добровольное освобождение от уголовной ответственности лица, которое после совершения преступления явилось с повинной, способствовало раскрытию преступления и возместило ущерб." },
          { term: "Соучастие", definition: "Умышленное совместное участие двух или более лиц в совершении умышленного преступления." },
          { term: "Окончательное обвинение", definition: "Совокупность сформулированных процессуальных претензий, предъявляемых лицу после завершения досудебного расследования." },
          { term: "Превенция (Общая и специальная)", definition: "Предупреждение совершения новых преступлений как со стороны самого правонарушителя (специальная), так и со стороны иных лиц (общая)." }
        ]
      },
      {
        id: 5,
        title: "Блок 5: Трудовое, административное и международное публичное право РК",
        cards: [
          { term: "Дискриминация в сфере труда", definition: "Любое различие, исключение или предпочтение, приводящее к нарушению равенства возможностей в осуществлении трудовых прав." },
          { term: "Дисциплинарный проступок", definition: "Противоправное, виновное неисполнение или ненадлежащее исполнение работником своих трудовых обязанностей." },
          { term: "Материальная ответственность работодателя", definition: "Обязанность работодателя возместить работнику ущерб, причиненный незаконным лишением возможности трудиться или повреждением его имущества." },
          { term: "Административное задержание", definition: "Кратковременное ограничение свободы физического лица, совершившего административное правонарушение, в целях пресечения правонарушения и установления личности." },
          { term: "Юрисдикция территориальная", definition: "Полномочия государственных органов осуществлять властные функции в пределах конкретной географической территории государства." },
          { term: "Экстрадиция", definition: "Выдача лица иностранному государству для привлечения к уголовной ответственности или приведения приговора в исполнение." },
          { term: "Дипломатический иммунитет", definition: "Совокупность прав и привилегий, предоставляемых дипломатическим представительствам и их сотрудникам, освобождающих от юрисдикции принимающего государства." },
          { term: "Ратификация", definition: "Утверждение международного договора высшим органом государственной власти страны, придающее ему обязательную юридическую силу." },
          { term: "Денонсация", definition: "Официальный отказ государства от заключенного им международного договора в установленном порядке." },
          { term: "Persona non grata (Персона нон грата)", definition: "Объявление дипломатического агента нежелательным лицом, влекущее прекращение его миссии." },
          { term: "Казус белли (Casus belli)", definition: "Формальный повод для объявления войны или начала международных санкций." },
          { term: "Кондоминиум (в международном праве)", definition: "Совместное осуществление верховной власти над одной и той же территорией двумя или более государствами." },
          { term: "Реторсия", definition: "Правомерные ответные принудительные меры одного государства против недружественных действий другого государства." },
          { term: "Репрессалии", definition: "Ответные правоограничительные меры невоенного характера, применяемые в отношении государства, совершившего международное правонарушение." },
          { term: "Иммунитет государства (Суверенный иммунитет)", definition: "Принцип международного права, согласно которому одно государство не может быть подчинено юрисдикции судов другого государства без его прямого согласия." }
        ]
      }
    ],
    kz: [
      {
        id: 1,
        title: "1-блок: Мемлекет және құқық теориясы мен ҚР конституциялық құрылысы",
        cards: [
          { term: "Нормативтік құқықтық акт (НҚА)", definition: "Референдумда не уәкілетті орган немесе мемлекеттің лауазымды адамы қабылдаған, құқық нормаларын белгілейтін, олардың қолданылуын өзгертетін, тоқтататын или тоқташа тұратын белгіленген нысандағы жазбаша ресми құжат." },
          { term: "Заңға тәуелді актілер қатары (Заңға тәуелді акт)", definition: "Заңдардың негізінде әрі оларды орындау үшін шығарылатын және оларға қайшы келмейтін НҚА." },
          { term: "Заңды коллизия (Құқықтық коллизия)", definition: "Бірдей қоғамдық қатынастарды реттейтін әртүрлі нормативтік құқықтық актілер арасындағы алшақтық немесе қайшылық." },
          { term: "Құқықты инкорпорациялау", definition: "Заңнаманы олардың мазмұнын өзгертпей НҚА-ны жинақтарға біріктіру арқылы жүйелеу тәсілі." },
          { term: "Құқықты кодификациялау", definition: "Құқық нормаларын қайта өңдеу және жаңа біртұтас кодификацияланған актіні (кодексті) жасау арқылы заңнаманы жүйелеу тәсілі." },
          { term: "Делегатталған заңнама", definition: "Парламенттің Үкіметке немесе өзге органға заң күші бар актілерді шығару бойынша уақытша өкілеттіктер беруі." },
          { term: "Құқық нормаларын трансформациялау", definition: "Халықаралық-құқықтық нормаларды ұлттық заңнамаға ресми көшіру арқылы іске асыру тәсілі." },
          { term: "Құқық рецепциясы", definition: "Мемлекеттің бөтен құқықтық жүйені қабылдауы (рим немесе англосаксон құқығының қағидаттарын толық немесе ішінара қабылдау)." },
          { term: "Деликтілік қабілеттілік", definition: "Тұлғаның жасалған құқық бұзушылық үшін заңды жауаптылықта болу қабілеті." },
          { term: "Құқықсубъектілік", definition: "Тұлғаның құқық қабілеттілігі мен әрекет қабілеттілігінен тұратын, құқықтық қатынастардың қатысушысы (субъектісі) болу қабілеті." },
          { term: "Императивті норма", definition: "Тараптардың келісімі бойынша ауытқуға жол бермейтін заңның қатаң міндетті ұйғарымы." },

          { term: "Репрессалиялар", definition: "Халықаралық құқық бұзушылық жасаған мемлекетке қатысты қолданылатын әскери емес сипаттағы жауапты құқықтық шектеу шаралары." },
          { term: "Мемлекет иммунитеті (Егемендік иммунитеті)", definition: "Халықаралық құқықтың қағидаты, оған сәйкес бір мемлекет екінші мемлекеттің тікелей келісімінсіз оның соттарының юрисдикциясына бағына алмайды." }
        ]
      }
    ]
  };

  let currentLang = localStorage.getItem("jusprep_lang") || "ru";

  const blocksContainer = document.getElementById("blocksContainer");
  const studyModal = document.getElementById("studyModal");
  const modalBlockTitle = document.getElementById("modalBlockTitle");
  const closeStudy = document.getElementById("closeStudy");
  const flashcard = document.getElementById("flashcard");
  const flashcardText = document.getElementById("flashcardText");
  const flashcardHint = document.getElementById("flashcardHint");
  const cardCounter = document.getElementById("cardCounter");
  const btnAgain = document.getElementById("btnAgain");
  const btnLearned = document.getElementById("btnLearned");

  const completionModal = document.getElementById("completionModal");
  const completionCloseBtn = document.getElementById("completionCloseBtn");

  const langRuBtn = document.getElementById("langRuBtn");
  const langKzBtn = document.getElementById("langKzBtn");

  const lblHome = document.getElementById("lblHome");
  const pageTitle = document.getElementById("pageTitle");
  const footerText = document.getElementById("footerText");
  const lblBtnAgain = document.getElementById("lblBtnAgain");
  const lblBtnLearned = document.getElementById("lblBtnLearned");
  const completionTitle = document.getElementById("completionTitle");
  const completionDesc = document.getElementById("completionDesc");

  let currentBlockIndex = 0;
  let currentRoundCards = []; 
  let nextRoundCards = [];    
  let currentIndex = 0;
  let isShowingDefinition = false;
  let savedSessions = {};

  function updateLanguageUI() {
    const t = uiTranslations[currentLang];

    document.documentElement.lang = currentLang;
    lblHome.textContent = t.navHome;
    pageTitle.textContent = t.pageTitle;
    footerText.textContent = t.footer;
    lblBtnAgain.textContent = t.btnAgain;
    lblBtnLearned.textContent = t.btnLearned;
    completionTitle.textContent = t.completionTitle;
    completionDesc.textContent = t.completionDesc;
    completionCloseBtn.textContent = t.completionBtn;

    if (currentLang === "ru") {
      langRuBtn.classList.add("active");
      langKzBtn.classList.remove("active");
    } else {
      langKzBtn.classList.add("active");
      langRuBtn.classList.remove("active");
    }

    renderBlocks();
    if (studyModal.style.display === "flex") {
      const block = flashcardBlocksData[currentLang][currentBlockIndex];
      modalBlockTitle.textContent = block.title;
      updateCardView();
    }
  }

  langRuBtn.addEventListener("click", () => {
    if (currentLang !== "ru") {
      currentLang = "ru";
      localStorage.setItem("jusprep_lang", "ru");
      updateLanguageUI();
    }
  });

  langKzBtn.addEventListener("click", () => {
    if (currentLang !== "kz") {
      currentLang = "kz";
      localStorage.setItem("jusprep_lang", "kz");
      updateLanguageUI();
    }
  });

  function renderBlocks() {
    blocksContainer.innerHTML = "";
    const blocks = flashcardBlocksData[currentLang];
    const t = uiTranslations[currentLang];

    blocks.forEach((block, index) => {
      const hasActiveSession = savedSessions[index] && savedSessions[index].currentRoundCards.length > 0;
      const card = document.createElement("div");
      card.classList.add("block-card");
      card.innerHTML = `
        <div class="block-top">
          <span class="block-badge">${block.cards.length} ${t.termsSuffix}</span>
          <h3>${block.title}</h3>
        </div>
        <div class="block-action" data-index="${index}">
          <span>${hasActiveSession ? t.btnContinue : t.btnStart}</span> 
          <i class="fas fa-arrow-right"></i>
        </div>
      `;
      blocksContainer.appendChild(card);
    });

    document.querySelectorAll(".block-action").forEach(btn => {
      btn.addEventListener("click", () => {
        currentBlockIndex = parseInt(btn.dataset.index);
        startOrResumeSession(currentBlockIndex);
      });
    });
  }

  function startOrResumeSession(blockIndex) {
    const block = flashcardBlocksData[currentLang][blockIndex];
    
    if (savedSessions[blockIndex] && savedSessions[blockIndex].currentRoundCards.length > 0) {
      currentRoundCards = savedSessions[blockIndex].currentRoundCards;
      nextRoundCards = savedSessions[blockIndex].nextRoundCards;
      currentIndex = savedSessions[blockIndex].currentIndex;
    } else {
      currentRoundCards = [...block.cards];
      nextRoundCards = [];
      currentIndex = 0;
    }

    modalBlockTitle.textContent = block.title;
    isShowingDefinition = false;
    
    updateCardView();
    studyModal.style.display = "flex";
  }

  function updateCardView() {
    const cardData = currentRoundCards[currentIndex];
    const t = uiTranslations[currentLang];
    
    if (isShowingDefinition) {
      flashcardText.textContent = cardData.definition;
      flashcardHint.textContent = t.hintTerm;
      flashcard.style.borderColor = "var(--gold-2)";
      flashcard.style.background = "linear-gradient(145deg, #fefce8, #fef9c3)";
    } else {
      flashcardText.textContent = cardData.term;
      flashcardHint.textContent = t.hintDefinition;
      flashcard.style.borderColor = "var(--border)";
      flashcard.style.background = "linear-gradient(145deg, #ffffff, #f8fafc)";
    }
    
    cardCounter.textContent = `${t.cardCounterPrefix} ${currentRoundCards.length - currentIndex}`;
    saveCurrentProgress();
  }

  function saveCurrentProgress() {
    if (currentRoundCards.length > 0) {
      savedSessions[currentBlockIndex] = {
        currentRoundCards,
        nextRoundCards,
        currentIndex
      };
    } else {
      delete savedSessions[currentBlockIndex];
    }
  }

  flashcard.addEventListener("click", (e) => {
    if (Math.abs(currentX) > 10) return;
    isShowingDefinition = !isShowingDefinition;
    updateCardView();
  });

  document.addEventListener("keydown", (e) => {
    if (studyModal.style.display !== "flex" || completionModal.style.display === "flex") return;

    if (e.key === "ArrowRight") {
      triggerSwipeRight();
    } else if (e.key === "ArrowLeft") {
      triggerSwipeLeft();
    }
  });

  btnLearned.addEventListener("click", () => triggerSwipeRight());
  btnAgain.addEventListener("click", () => triggerSwipeLeft());

  let isDragging = false;
  let startX = 0;
  let currentX = 0;
  let startY = 0;

  flashcard.addEventListener("mousedown", (e) => {
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    currentX = 0;
    flashcard.style.transition = "none";
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    currentX = e.clientX - startX;
    let currentY = e.clientY - startY;

    if (Math.abs(currentX) > Math.abs(currentY)) {
      if (currentX > 30) {
        flashcard.classList.add("swiping-right");
        flashcard.classList.remove("swiping-left");
      } else if (currentX < -30) {
        flashcard.classList.add("swiping-left");
        flashcard.classList.remove("swiping-right");
      } else {
        flashcard.classList.remove("swiping-left", "swiping-right");
      }
      flashcard.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.03}deg)`;
    }
  });

  window.addEventListener("mouseup", () => {
    if (!isDragging) return;
    isDragging = false;
    flashcard.style.transition = "transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.25s ease, opacity 0.35s ease";

    if (currentX > 80) {
      triggerSwipeRight();
    } else if (currentX < -80) {
      triggerSwipeLeft();
    } else {
      flashcard.style.transform = "translateX(0px) rotate(0deg)";
      flashcard.classList.remove("swiping-left", "swiping-right");
    }
    setTimeout(() => { currentX = 0; }, 50);
  });

  flashcard.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    currentX = 0;
    flashcard.style.transition = "none";
  }, { passive: true });

  flashcard.addEventListener("touchmove", (e) => {
    currentX = e.touches[0].clientX - startX;
    let currentY = e.touches[0].clientY - startY;
    
    if (Math.abs(currentX) > Math.abs(currentY)) {
      if (e.cancelable) e.preventDefault();
      if (currentX > 30) {
        flashcard.classList.add("swiping-right");
        flashcard.classList.remove("swiping-left");
      } else if (currentX < -30) {
        flashcard.classList.add("swiping-left");
        flashcard.classList.remove("swiping-right");
      } else {
        flashcard.classList.remove("swiping-left", "swiping-right");
      }
      flashcard.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.03}deg)`;
    }
  }, { passive: false });

  flashcard.addEventListener("touchend", (e) => {
    flashcard.style.transition = "transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.25s ease, opacity 0.35s ease";
    flashcard.classList.remove("swiping-left", "swiping-right");
    
    if (currentX > 60) {
      triggerSwipeRight();
    } else if (currentX < -60) {
      triggerSwipeLeft();
    } else {
      flashcard.style.transform = "translateX(0px) rotate(0deg)";
    }
    setTimeout(() => { currentX = 0; }, 50);
  });

  function triggerSwipeRight() {
    flashcard.classList.add("swiping-right");
    setTimeout(() => {
      flashcard.classList.remove("swiping-right");
      flashcard.style.transition = "none";
      flashcard.style.transform = "translateX(0) rotate(0deg)";
      handleSwipeRight();
      setTimeout(() => {
        flashcard.style.transition = "transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, opacity 0.35s ease";
      }, 30);
    }, 220);
  }

  function triggerSwipeLeft() {
    flashcard.classList.add("swiping-left");
    setTimeout(() => {
      flashcard.classList.remove("swiping-left");
      flashcard.style.transition = "none";
      flashcard.style.transform = "translateX(0) rotate(0deg)";
      handleSwipeLeft();
      setTimeout(() => {
        flashcard.style.transition = "transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, opacity 0.35s ease";
      }, 30);
    }, 220);
  }

  function handleSwipeRight() {
    currentRoundCards.splice(currentIndex, 1);
    processQueueAfterAction();
  }

  function handleSwipeLeft() {
    const card = currentRoundCards.splice(currentIndex, 1)[0];
    nextRoundCards.push(card);
    processQueueAfterAction();
  }

  function processQueueAfterAction() {
    isShowingDefinition = false;

    if (currentIndex >= currentRoundCards.length) {
      if (nextRoundCards.length > 0) {
        currentRoundCards = [...nextRoundCards];
        nextRoundCards = [];
        currentIndex = 0;
      } else {
        studyModal.style.display = "none";
        delete savedSessions[currentBlockIndex];
        renderBlocks();
        
        saveCompletedBlockToProfile();

        showCompletionModal();
        return;
      }
    }

    updateCardView();
  }

  async function saveCompletedBlockToProfile() {
    const block = flashcardBlocksData[currentLang][currentBlockIndex];
    const totalCount = block.cards.length;

    // 1. Сохранение в localStorage (резервная копия)
    let savedBlocks = JSON.parse(localStorage.getItem("jusprep_completed_cards") || "[]");

    const blockRecord = {
      id: block.id,
      title: block.title,
      count: totalCount,
      date: new Date().toISOString()
    };

    const existingIndex = savedBlocks.findIndex(b => b.id === block.id);
    if (existingIndex >= 0) {
      savedBlocks[existingIndex] = blockRecord;
    } else {
      savedBlocks.push(blockRecord);
    }

    localStorage.setItem("jusprep_completed_cards", JSON.stringify(savedBlocks));

    // 2. Сохранение в Firestore (коллекция flashcard_submissions)
    if (auth && auth.currentUser) {
      try {
        await addDoc(collection(db, "flashcard_submissions"), {
          userId: auth.currentUser.uid,
          id: block.id,
          title: block.title,
          count: totalCount,
          createdAt: serverTimestamp()
        });
        console.log("Прогресс карточек успешно сохранен в Firestore!");
      } catch (error) {
        console.error("Ошибка при сохранении прогресса карточек в Firestore:", error);
      }
    }
  }

  function showCompletionModal() {
    completionModal.style.display = "flex";
    confetti({
      particleCount: 70,
      spread: 60,
      origin: { y: 0.6 }
    });
  }

  completionCloseBtn.addEventListener("click", () => {
    completionModal.style.display = "none";
  });

  completionModal.addEventListener("click", (e) => {
    if (e.target === completionModal) {
      completionModal.style.display = "none";
    }
  });

  closeStudy.addEventListener("click", () => {
    saveCurrentProgress();
    studyModal.style.display = "none";
    renderBlocks();
  });

  window.addEventListener("click", e => {
    if (e.target === studyModal) {
      saveCurrentProgress();
      studyModal.style.display = "none";
      renderBlocks();
    }
  });

  updateLanguageUI();
</script>

</body>
</html>
