<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Регистрация — JusPrep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#f7f9ff;--card:#ffffff;--navy:#102b73;--blue:#3047c9;--soft:#eef2ff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"Inter",sans-serif;background:linear-gradient(180deg,#f8faff,#f5f7ff);color:var(--text);display:grid;place-items:center;min-height:100vh;padding:24px;}
        .auth-card{background:var(--card);width:100%;max-width:440px;padding:40px;border-radius:32px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(24,43,100,.09);}
        h1{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-bottom:8px;color:var(--navy);}
        p{font-size:15px;color:var(--muted);margin-bottom:28px;}
        .form-group{margin-bottom:20px;}
        label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;}
        input{width:100%;height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);font-size:15px;outline:none;transition:.2s;font-family:inherit;}
        input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--soft);}
        .btn{width:100%;height:48px;border-radius:14px;background:linear-gradient(135deg,#102b73,#173e9e);color:white;font-weight:700;font-size:15px;cursor:pointer;border:none;margin-top:10px;transition:.2s;}
        .btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(16,43,115,.18);}
        .error{background:#fff2f2;color:#dc2626;padding:12px;border-radius:12px;font-size:14px;margin-bottom:20px;display:none;}
        .footer-text{text-align:center;margin-top:24px;font-size:14px;color:var(--muted);}
        .footer-text a{color:var(--blue);font-weight:700;text-decoration:none;}
    </style>
</head>
<body>
    <!-- ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА УДАЛЁН — язык определяется автоматически из localStorage -->

    <div class="auth-card">
        <h1 id="txt-title">Создать аккаунт</h1>
        <p id="txt-subtitle">Начните подготовку к олимпиадам с JusPrep</p>
        <div id="errorMsg" class="error"></div>
        <form id="registerForm">
            <div class="form-group">
                <label id="lbl-name">Ваше имя</label>
                <input type="text" id="name" required placeholder="Нурай">
            </div>
            <div class="form-group">
                <label id="lbl-email">Email</label>
                <input type="email" id="email" required placeholder="student@nis.edu.kz">
            </div>
            <div class="form-group">
                <label id="lbl-password">Пароль</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="btn-submit">Зарегистрироваться</button>
        </form>
        <div class="footer-text">
            <span id="txt-account">Уже есть аккаунт?</span> <a href="login.html" id="link-login">Войти</a>
        </div>
    </div>

    <script>
        // ============ ПЕРЕВОДЫ ============
        const translations = {
            ru: {
                pageTitle: "Регистрация — JusPrep",
                title: "Создать аккаунт",
                subtitle: "Начните подготовку к олимпиадам с JusPrep",
                lblName: "Ваше имя",
                lblEmail: "Email",
                lblPassword: "Пароль",
                btnSubmit: "Зарегистрироваться",
                txtAccount: "Уже есть аккаунт?",
                linkLogin: "Войти",
                authError: "Ошибка регистрации: "
            },
            kz: {
                pageTitle: "Тіркелу — JusPrep",
                title: "Аккаунт жасау",
                subtitle: "JusPrep арқылы олимпиадаларға дайындалуды бастаңыз",
                lblName: "Сіздің атыңыз",
                lblEmail: "Электрондық пошта (Email)",
                lblPassword: "Құпиясөз",
                btnSubmit: "Тіркелу",
                txtAccount: "Аккаунтыңыз бар ма?",
                linkLogin: "Кіру",
                authError: "Тіркелу қатесі: "
            }
        };

        // ============ ОПРЕДЕЛЕНИЕ ЯЗЫКА ============
        function getCurrentLang() {
            return localStorage.getItem("jusprep_lang") || "ru";
        }

        function updateUILanguage() {
            const lang = getCurrentLang();
            document.documentElement.lang = lang;
            
            document.getElementById("pageTitle").innerText = translations[lang].pageTitle;
            document.getElementById("txt-title").innerText = translations[lang].title;
            document.getElementById("txt-subtitle").innerText = translations[lang].subtitle;
            document.getElementById("lbl-name").innerText = translations[lang].lblName;
            document.getElementById("lbl-email").innerText = translations[lang].lblEmail;
            document.getElementById("lbl-password").innerText = translations[lang].lblPassword;
            document.getElementById("btn-submit").innerText = translations[lang].btnSubmit;
            document.getElementById("txt-account").innerText = translations[lang].txtAccount;
            document.getElementById("link-login").innerText = translations[lang].linkLogin;
        }

        // Инициализация при загрузке
        window.addEventListener("DOMContentLoaded", () => {
            updateUILanguage();
        });

        // Слушаем изменения в localStorage (если язык изменился на другой вкладке)
        window.addEventListener('storage', (e) => {
            if (e.key === 'jusprep_lang') {
                updateUILanguage();
            }
        });
    </script>

    <script type="module">
        // Импорт Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBxECtixerAiOZAntZqdk9OLAiwC3-xvI8",
            authDomain: "jusprep-e9ad2.firebaseapp.com",
            projectId: "jusprep-e9ad2",
            storageBucket: "jusprep-e9ad2.firebasestorage.app",
            messagingSenderId: "832094265855",
            appId: "1:832094265855:web:df390cb36037d457a687ca"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Функция для получения перевода ошибки
        function getAuthErrorText(err) {
            const lang = getCurrentLang();
            return translations[lang].authError + err.message;
        }

        // Логика регистрации
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMsg");

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    displayName: name,
                    email: email,
                    xp: 0,
                    streak: 0,
                    completedTests: 0,
                    completedWritten: 0,
                    currentTopic: "",
                    createdAt: serverTimestamp()
                });

                window.location.href = "index.html";
            } catch (err) {
                errorDiv.style.display = "block";
                errorDiv.textContent = getAuthErrorText(err);
            }
        });
    </script>
</body>
</html>
