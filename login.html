<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Вход — JusPrep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#f7f9ff;--card:#ffffff;--navy:#102b73;--blue:#3047c9;--soft:#eef2ff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"Inter",sans-serif;background:linear-gradient(180deg,#f8faff,#f5f7ff);color:var(--text);display:grid;place-items:center;min-height:100vh;padding:24px;position:relative;}
        
        /* Переключатель языков / Тіл ауыстырғыш */
        .lang-switch {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 6px;
            background: var(--card);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--line);
            box-shadow: 0 4px 12px rgba(24,43,100,.05);
        }
        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
            font-family: inherit;
        }
        .lang-btn.active {
            background: var(--soft);
            color: var(--blue);
        }

        .auth-card{background:var(--card);width:100%;max-width:440px;padding:40px;border-radius:32px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(24,43,100,.09);}
        h1{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-bottom:8px;color:var(--navy);}
        p{font-size:15px;color:var(--muted);margin-bottom:28px;}
        .form-group{margin-bottom:20px;}
        label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;}
        input{width:100%;height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);font-size:15px;outline:none;transition:.2s;font-family:inherit;}
        input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--soft);}
        .btn{width:100%;height:48px;border-radius:14px;background:linear-gradient(135deg,#102b73,#173e9e);color:white;font-weight:700;font-size:15px;cursor:pointer;border:none;margin-top:10px;transition:.2s;}
        .btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(16,43,115,.18);}
        .error{background:#fff2f2;color:#dc2626;padding:12px;border-radius:12px;font-size:14px;margin-bottom:20px;display:none;}
        .footer-text{text-align:center;margin-top:24px;font-size:14px;color:var(--muted);}
        .footer-text a{color:var(--blue);font-weight:700;text-decoration:none;}
    </style>
</head>
<body>
    <!-- Переключатель языка -->
    <div class="lang-switch">
        <button type="button" class="lang-btn active" id="btn-ru" onclick="setLanguage('ru')">RU</button>
        <button type="button" class="lang-btn" id="btn-kz" onclick="setLanguage('kz')">KZ</button>
    </div>

    <div class="auth-card">
        <h1 id="txt-title">С возвращением!</h1>
        <p id="txt-subtitle">Введите данные для входа в личный кабинет</p>
        <div id="errorMsg" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label id="lbl-email">Email</label>
                <!-- Сохранен твой стильный placeholder -->
                <input type="email" id="email" required placeholder="student@nis.edu.kz">
            </div>
            <div class="form-group">
                <label id="lbl-password">Пароль</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="btn-submit">Войти</button>
        </form>
        <div class="footer-text" id="footer-container">
            <span id="txt-noaccount">Еще нет аккаунта?</span> <a href="register.html" id="link-register">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        // Переводы (Локализация)
        const translations = {
            ru: {
                pageTitle: "Вход — JusPrep",
                title: "С возвращением!",
                subtitle: "Введите данные для входа в личный кабинет",
                lblEmail: "Email",
                lblPassword: "Пароль",
                btnSubmit: "Войти",
                noAccount: "Еще нет аккаунта?",
                linkRegister: "Зарегистрироваться",
                authError: "Ошибка входа: неверный email или пароль."
            },
            kz: {
                pageTitle: "Кіру — JusPrep",
                title: "Қайта оралуыңызбен!",
                subtitle: "Жеке кабинетке кіру үшін деректерді енгізіңіз",
                lblEmail: "Электрондық пошта (Email)",
                lblPassword: "Құпиясөз",
                btnSubmit: "Кіру",
                noAccount: "Әлі тіркелмедіңіз бе?",
                linkRegister: "Тіркелу",
                authError: "Кіру қатесі: электрондық пошта немесе құпиясөз қате."
            }
        };

        let currentLang = localStorage.getItem("jusprep_lang") || "ru";

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("jusprep_lang", lang);
            document.documentElement.lang = lang;

            // Обновляем тексты в DOM
            document.getElementById("pageTitle").innerText = translations[lang].pageTitle;
            document.getElementById("txt-title").innerText = translations[lang].title;
            document.getElementById("txt-subtitle").innerText = translations[lang].subtitle;
            document.getElementById("lbl-email").innerText = translations[lang].lblEmail;
            document.getElementById("lbl-password").innerText = translations[lang].lblPassword;
            document.getElementById("btn-submit").innerText = translations[lang].btnSubmit;
            document.getElementById("txt-noaccount").innerText = translations[lang].noAccount;
            document.getElementById("link-register").innerText = translations[lang].linkRegister;

            // Переключение активных кнопок
            document.getElementById("btn-ru").classList.toggle("active", lang === "ru");
            document.getElementById("btn-kz").classList.toggle("active", lang === "kz");
        }

        // Инициализация при загрузке
        window.addEventListener("DOMContentLoaded", () => {
            setLanguage(currentLang);
        });
    </script>

    <script type="module">
        // 1. Берем только нужный метод из CDN
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        
        // 2. Берем готовый auth из нашего единого центра управления
        import { auth } from './firebase.js';

        // 3. Твоя логика обработки формы
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMsg");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Успешный вход — отправляем на главную
                window.location.href = "index.html";
            } catch (err) {
                errorDiv.style.display = "block";
                // Используем переведенную ошибку
                const lang = localStorage.getItem("jusprep_lang") || "ru";
                errorDiv.textContent = translations[lang].authError;
            }
        });
    </script>
</body>
</html>
