<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JusPrep - Письменные практики (Олимпиада Дарын)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<style>
    :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --border: #e2e8f0;
        --primary: #1e3a8a;
        --primary-light: #eff6ff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #3b82f6;
        --success: #22c55e;
        --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        scroll-behavior: smooth;
        width: 100%;
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', sans-serif;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }

    .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 32px 56px 56px;
    }

    header {
        width: 100%;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 36px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        padding: 0 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02);
        position: sticky;
        top: 20px;
        z-index: 100;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 800;
        color: var(--primary);
    }

    .logo-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%);
        display: grid;
        place-items: center;
        color: white;
        font-size: 20px;
    }

    .btn {
        height: 40px;
        padding: 0 20px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 700;
        transition: all .25s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-outline {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
    }
    .btn-outline:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--primary-light);
    }

    main { width: 100%; flex: 1; display: flex; flex-direction: column; }

    .tests-header { margin-bottom: 36px; max-width: 850px; }
    .tests-header h1 { font-size: 44px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .tests-header p { font-size: 18px; color: var(--muted); line-height: 1.5; }

    .filter-tabs { display: flex; gap: 12px; margin-bottom: 32px; }
    .tab-btn {
        padding: 10px 24px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        transition: all 0.2s ease;
    }
    .tab-btn.active, .tab-btn:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
    }

    .tasks-list { display: flex; flex-direction: column; gap: 24px; margin-bottom: 50px; }
    .task-card {
        background: var(--surface);
        border-radius: 24px;
        border: 1px solid var(--border);
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.04);
    }

    .task-meta { display: flex; justify-content: space-between; align-items: center; }
    .task-badge {
        background: var(--primary-light);
        color: var(--primary);
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
    }
    .task-title { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1.4; }

    .task-textarea {
        width: 100%;
        min-height: 150px;
        padding: 16px 20px;
        border-radius: 16px;
        border: 2px solid var(--border);
        background: var(--bg);
        font-family: inherit;
        font-size: 15px;
        color: var(--text);
        resize: vertical;
        transition: all 0.2s ease;
    }
    .task-textarea:focus {
        border-color: var(--primary);
        background: var(--surface);
        outline: none;
        box-shadow: 0 0 0 4px var(--primary-light);
    }

    .task-footer { display: flex; justify-content: space-between; align-items: center; }
    .criteria-hint { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

    .ai-submit-btn {
        background: var(--primary);
        color: white;
        padding: 12px 28px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s ease;
    }
    .ai-submit-btn:hover { background: var(--accent); transform: translateY(-2px); }

    /* БЛОК ЭКСПЕРТНОГО ФИДБЭКА */
    .ai-feedback-box {
        display: none;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-left: 5px solid var(--primary);
        border-radius: 16px;
        padding: 24px;
        margin-top: 10px;
    }
    .feedback-header {
        font-weight: 800;
        font-size: 16px;
        color: var(--primary);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .feedback-content { font-size: 14px; color: var(--text); line-height: 1.6; }
    .feedback-section { margin-top: 12px; }
    .feedback-section strong { color: var(--primary); }

    footer {
        width: 100%;
        margin-top: auto;
        padding-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="page">
<header>
    <a href="index.html" class="logo">
        <div class="logo-mark">⚖</div>
        <span>JusPrep</span>
    </a>
    <a href="index.html" class="btn btn-outline">
        <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> На главную
    </a>
</header>

<main>
    <div class="tests-header">
        <h1>Письменные практические задания</h1>
        <p>Выполните развернутые задания олимпиады «Дарын». Ответы проверяются строго по официальным критериям жюри (определение, ссылки на НПА РК, анализ и терминология)[cite: 6, 7].</p>
    </div>

    <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterClass('10')">10 класс</button>
        <button class="tab-btn" onclick="filterClass('11')">11 класс</button>
    </div>

    <div class="tasks-list" id="tasksContainer"></div>
</main>

<footer>
    <div>© 2026 JusPrep. Подготовка к олимпиаде по праву РК.</div>
</footer>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";

    // Официальные базы заданий по праву РК (МПЦ «Дарын»)[cite: 6, 7]
    const writtenTasksData = {
        "10": [
            { id: 1, title: "Дайте понятие «брачный договор»[cite: 7]", maxScore: 5 },
            { id: 2, title: "Дайте понятие «трудовой спор» и назовите виды трудовых споров по трудовому законодательству РК[cite: 7]", maxScore: 5 },
            { id: 3, title: "Назовите особенности применения административных взысканий к несовершеннолетним[cite: 7]", maxScore: 5 },
            { id: 4, title: "Раскройте понятие республиканского референдума, указав его территорию и круг вопросов[cite: 7]", maxScore: 5 },
            { id: 5, title: "Дайте понятие «Отпуск» и раскройте виды отпусков по трудовому законодательству РК[cite: 7]", maxScore: 5 }
        ],
        "11": [
            { id: 1, title: "Перечислите обстоятельства, при которых не наступает материальная ответственность работника[cite: 6]", maxScore: 5 },
            { id: 2, title: "Раскройте понятие «прекращение брака (супружества)»[cite: 6]", maxScore: 5 },
            { id: 3, title: "Совокупность уголовных правонарушений по УК РК и особенности ответственности[cite: 6]", maxScore: 5 },
            { id: 4, title: "Дайте понятие юридического лица, перечислите виды и формы по Гражданскому кодексу РК[cite: 6]", maxScore: 5 },
            { id: 5, title: "Перечислите вопросы, которые не могут быть вынесены на республиканский референдум[cite: 6]", maxScore: 5 }
        ]
    };

    let activeClass = "10";

    function renderTasks(grade) {
        activeClass = grade;
        const container = document.getElementById("tasksContainer");
        container.innerHTML = "";

        const tasks = writtenTasksData[grade] || [];

        tasks.forEach((task, index) => {
            const card = document.createElement("div");
            card.classList.add("task-card");
            card.innerHTML = `
                <div class="task-meta">
                    <span class="task-badge">Задание №${index + 1} • ${grade} класс</span>
                    <span style="font-size: 13px; font-weight: 700; color: var(--muted);">Максимум: ${task.maxScore} баллов[cite: 6, 7]</span>
                </div>
                <div class="task-title">${task.title}</div>
                <textarea class="task-textarea" id="answer-${grade}-${task.id}" placeholder="Дайте развернутый ответ, укажите статьи НПА РК, термины и сделайте вывод..."></textarea>
                <div class="task-footer">
                    <span class="criteria-hint"><i class="fas fa-balance-scale"></i> Критерии: Определение, НПА, Анализ, Структура[cite: 6, 7]</span>
                    <button class="ai-submit-btn" onclick="window.submitTask(${task.id}, '${task.title.replace(/'/g, "")}', ${task.maxScore})">
                        <i class="fas fa-brain"></i> Получить экспертный разбор ИИ
                    </button>
                </div>
                <div class="ai-feedback-box" id="feedback-${grade}-${task.id}">
                    <div class="feedback-header"><i class="fas fa-clipboard-check"></i> Результат проверки жюри (ИИ)</div>
                    <div class="feedback-content" id="feedback-content-${grade}-${task.id}"></div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.filterClass = function(grade) {
        document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
        event.target.classList.add("active");
        renderTasks(grade);
    }

    window.submitTask = async function(taskId, taskTitle, maxScore) {
        const textarea = document.getElementById(`answer-${activeClass}-${taskId}`);
        const feedbackBox = document.getElementById(`feedback-${activeClass}-${taskId}`);
        const feedbackContent = document.getElementById(`feedback-content-${activeClass}-${taskId}`);
        
        const userText = textarea.value.trim();

        if (!userText.length) {
            alert("Пожалуйста, напишите развернутый ответ перед отправкой.");
            return;
        }

        feedbackBox.style.display = "block";
        feedbackContent.innerHTML = `<i class="fas fa-spinner fa-spin"><b> Выполняется детальный юридический анализ текста по стандартам «Дарын»...</b></i>`;

        try {
            // Запрос к вашему бэкенду/API ИИ для глубокого анализа
            const evaluation = await fetchRealAIEvaluation(taskTitle, userText, activeClass, maxScore);

            feedbackContent.innerHTML = `
                <div class="feedback-section"><strong>Итоговый балл:</strong> ${evaluation.score} / ${maxScore} баллов</div>
                <div class="feedback-section"><strong>Детальный разбор и ошибки:</strong><br>${evaluation.critique}</div>
                <div class="feedback-section" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                    <strong>Эталонный ответ по кодексам РК:</strong><br>${evaluation.sampleAnswer}
                </div>
            `;

            /* Сохранение в коллекцию written_submissions (Firebase)
            await addDoc(collection(db, "written_submissions"), {
                task: `${taskTitle} (${activeClass} класс)`,
                userAnswer: userText,
                score: `${evaluation.score}/${maxScore}`,
                feedback: evaluation.critique,
                sampleAnswer: evaluation.sampleAnswer,
                createdAt: serverTimestamp()
            });
            */

        } catch (error) {
            feedbackContent.innerHTML = `<span style="color: var(--danger);">Ошибка при связи с сервером проверки. Проверьте подключение.</span>`;
            console.error(error);
        }
    }

    // Функция взаимодействия с ИИ-моделью для строгого правового анализа
    async function fetchRealAIEvaluation(title, text, grade, maxScore) {
        // Здесь подключается ваш реальный эндпоинт генерации (например, Google Gemini API с промптом на соответствие НПА РК)
        // Ниже возвращается структура, которую формирует ИИ под ваши требования:
        return new Promise(resolve => {
            setTimeout(() => {
                resolve({
                    score: 4,
                    critique: "Определение дано верно, структура соблюдена. Однако отсутствуют точные ссылки на статьи конкретных нормативных правовых актов РК (например, ГК РК или ТК РК), что привело к снижению балла по критерию законодательства[cite: 6, 7].",
                    sampleAnswer: "В соответствии со статьями законодательства РК... [Здесь приводится полный эталонный текст ответа с указанием норм, терминов и логическим выводом]."
                });
            }, 2000);
        });
    }

    renderTasks("10");
</script>

</body>
</html>
