<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JusPrep — Цифровая подготовка по праву</title>

  <!-- Шрифты и стили -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Минимальные доработки под модал */
    #authModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    .auth-content {
      background: #fff;
      border-radius: 10px;
      padding: 30px 40px;
      width: 360px;
      max-width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      position: relative;
      font-family: "Open Sans", sans-serif;
    }
    .auth-content h2 { text-align: center; margin-bottom: 15px; color: #222; }
    .auth-content input {
      width: 100%; padding: 10px; margin-bottom: 12px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .auth-content button {
      width: 100%; padding: 10px;
      background: #facc15; border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer;
    }
    .auth-content .close {
      position: absolute; top: 10px; right: 12px;
      font-size: 20px; cursor: pointer; color: #666;
    }
    .login-register-tabs {
      display: flex; justify-content: space-around; margin-bottom: 15px;
    }
    .login-register-tabs button {
      background: none; border: none; cursor: pointer;
      font-weight: bold; color: #333; font-size: 14px;
    }
    .login-register-tabs button.active { color: #facc15; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header container">
    <div class="logo"><a href="index.html" style="color:white; text-decoration:none;">JusPrep</a></div>
    <nav class="nav">
      <ul>
        <li><a href="index.html" class="active">Главная</a></li>
        <li><a href="materials.html">Материалы</a></li>
        <li><a href="materials-cases.html">НПА & кейсы</a></li>
        <li><a href="quizzes.html">Викторины</a></li>
        <li><a href="tests.html">Олимпиадные задания</a></li>
        <li><a href="#news">Новости</a></li>
        <li><a href="profile.html">Профиль</a></li>
      </ul>
    </nav>
    <div class="login-icon" id="loginBtn" title="Вход или регистрация">
      <i class="fas fa-user-circle" style="color:#facc15; font-size:34px;"></i>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <!-- ⭐ Твой основной контент (не трогал) -->
    <section class="hero">
      <h1>Добро пожаловать в JusPrep</h1>
      <p>Цифровая подготовка к олимпиадам по праву и обществознанию</p>
      <a href="materials.html" class="btn">Начать обучение</a>
    </section>

    <!-- Другие секции сайта, если есть -->
    <!-- ... -->
  </main>

  <footer class="footer container">
    <p>© 2025 JusPrep</p>
  </footer>

  <!-- 🔐 МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ -->
  <div id="authModal">
    <div class="auth-content">
      <span class="close">&times;</span>

      <div class="login-register-tabs">
        <button id="tabLogin" class="active">Вход</button>
        <button id="tabRegister">Регистрация</button>
      </div>

      <!-- Форма входа -->
      <form id="loginForm">
        <h2>Войти</h2>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button type="submit">Войти</button>
      </form>

      <!-- Форма регистрации -->
      <form id="registerForm" style="display:none;">
        <h2>Регистрация</h2>
        <input type="text" id="regUsername" placeholder="Имя пользователя" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Пароль" required>
        <button type="submit">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <!-- 🔗 Подключения -->
  <script type="module" src="./script.js"></script>

  <script>
    // Переключение вкладок вход / регистрация
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
    });
    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
    });
  </script>

</body>
</html>
