            meta_kz: "Облыстық кезең (2023) | 11-сынып",
            question_kz: "Адамда екі бастаудың — аполлондық және дионистік бастаулардың болуы туралы тұжырымдаманың, сондай-ақ асқақ адам және билікке ерік идеяларының авторы",
            options_kz: [
                "A. Ф.Ницше",
                "B. С.Кьеркегор",
                "C. К.Маркс",
                "D. О.Конт",

            ],
            explanation_kz: "Аполлондық және дионистік бастаулар тұжырымдамасы, сондай-ақ билікке ерік пен асқақ адам идеялары неміс философы Фридрих Ницшеге тиесілі."
        },
        {
            meta: "Областной этап (2023) | 11 класс",
            question: "Первый представитель восточного аристотелизма",
            options: [
                "A. Ибн-Рушд",
                "B. Аль-Газали",
                "C. Аль-Бируни",
                "D. Аль-Кинди",
                "E. Аль-Фараби"
            ],
            correct: 3,
            explanation: "Первым выдающимся представителем арабского/восточного перипатетизма (аристотелизма) исторически признан Абу Юсуф Якуб ибн Исхак аль-Кинди.",
            meta_kz: "Облыстық кезең (2023) | 11-сынып",
            question_kz: "Шығыс аристотелизмінің алғашқы өкілі",
            options_kz: [
                "A. Ибн-Рушд",
                "B. Әл-Ғазали",
                "C. Әл-Бируни",
                "D. Әл-Кинди",
                "E. Әл-Фараби"
            ],
            explanation_kz: "Тарихта араб/шығыс перипатетизмінің (аристотелизмінің) алғашқы көрнекті өкілі ретінде Әбу Юсуф Яқуб ибн Исхақ әл-Кинди танылған."
        },
        {
            meta: "Областной этап (2023) | 11 класс",
            question: "Немецкая классическая философия начинается с",
            options: [
                "A. Фихте",
                "B. Шеллинга",
                "C. Маркса",
                "D. Гете",
                "E. Канта"
            ],
            correct: 4,
            explanation: "Основоположником немецкой классической философии является Иммануил Кант.",
            meta_kz: "Облыстық кезең (2023) | 11-сынып",
            question_kz: "Неміс классикалық философиясы ... басталады",
            options_kz: [
                "A. Фихтеден",
                "B. Шеллингтен",
                "C. Маркстен",
                "D. Гётеден",
                "E. Канттан"
            ],
            explanation_kz: "Неміс классикалық философиясының негізін қалаушы — Иммануил Кант."
        },
        {
            meta: "Областной этап (2023) | 11 класс",
            question: "Основная проблема представителей казахского просвещения",
            options: [
                "A. материализм",
                "B. гуманизм",
                "C. метафизика",
                "D. иррационализм",
                "E. телеологизм"
            ],
            correct: 1,
            explanation: "Главной проблематикой и ценностным ориентиром казахских просветителей (Ч. Валиханов, И. Алтынсарин, А. Кунанбаев) выступал гуманизм, просвещение народа, защита его прав и культуры.",
            meta_kz: "Облыстық кезең (2023) | 11-сынып",
            question_kz: "Қазақ ағартушылары өкілдерінің негізгі мәселесі",
            options_kz: [
                "A. материализм",
                "B. гуманизм",
                "C. метафизика",
                "D. иррационализм",
                "E. телеологизм"
            ],
            explanation_kz: "Қазақ ағартушыларының (Ш. Уәлиханов, Ы. Алтынсарин, А. Құнанбаев) басты мәселесі әрі құндылық бағдары гуманизм, халықты ағарту, оның құқықтары мен мәдениетін қорғау болды."
        },
        {
            meta: "Областной этап (2023) | 11 класс",
            question: "Философские взгляды Ш. Валиханова рассматриваются в контексте:",
            options: [
                "A. онтологии",
                "B. гносеологии",
                "C. философии религии",
                "D. философии истории",
                "E. аксиологии"
            ],
            correct: 3,
            explanation: "Философско-исторические и социологические взгляды Чокана Валиханова традиционно исследуются в контексте философии истории (анализ путей развития общества, критика колониализма и патриархальных устоев).",
            meta_kz: "Облыстық кезең (2023) | 11-сынып",
            question_kz: "Ш. Уәлихановтың философиялық көзқарастары ... тұрғысынан қарастырылады:",
            options_kz: [
                "A. онтология",
                "B. гносеология",
                "C. дін философиясы",
                "D. тарих философиясы",
                "E. аксиология"
            ],
            explanation_kz: "Шоқан Уәлихановтың философиялық-тарихи және әлеуметтанулық көзқарастары дәстүрлі түрде тарих философиясы тұрғысынан зерттеледі (қоғам даму жолдарын талдау, отаршылдықты және патриархалдық салттарды сынау)."
        }
    ]);

    let sessionQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentLimit = 5;
    let selectedOptionIndex = null;

    window.startQuiz = function(limit) {
        currentLimit = limit;
        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("quizSession").style.display = "block";
        
        let shuffled = [...allQuestions];
        sessionQuestions = shuffled.slice(0, Math.min(limit, allQuestions.length));
        currentIndex = 0;
        score = 0;
        renderQuestion();
    }

    window.returnToMenu = function() {
        document.getElementById("quizSession").style.display = "none";
        document.getElementById("menuScreen").style.display = "block";
    }

    async function saveTestAttempt(score, maxScore) {
        const user = auth.currentUser;
        if (!user) return; 

        try {
            await addDoc(collection(db, "attempts"), {
                userId: user.uid,
                title: `Тест по философии (11 класс) [${maxScore} вопр.]`,
                score: score,
                maxScore: maxScore,
                createdAt: new Date().toLocaleDateString("ru-RU")
            });
        } catch (e) {
            console.error("Ошибка при сохранении результата: ", e);
        }
    }

    function renderQuestion() {
        const container = document.getElementById("quizContainer");
        const statsCounter = document.getElementById("statsCounter");
        const progressBarFill = document.getElementById("progressBarFill");
        selectedOptionIndex = null;
        
        container.innerHTML = "";

        const progressPercent = (currentIndex / sessionQuestions.length) * 100;
        progressBarFill.style.width = `${progressPercent}%`;

        if (currentIndex >= sessionQuestions.length) {
            statsCounter.textContent = JP.t("Тест завершен!", "Тест аяқталды!");
            progressBarFill.style.width = "100%";
            
            saveTestAttempt(score, sessionQuestions.length);

            container.innerHTML = `<div class="question-card" style="text-align: center;">
                <h2 style="margin-bottom: 12px; color: var(--primary);">${JP.t(`Результаты теста`, `Тест нәтижелері`)}</h2>
                <p style="margin-bottom: 24px; color: var(--muted);">${JP.t(`Вы правильно ответили на <strong>${score}</strong> из <strong>${sessionQuestions.length}</strong> вопросов.`, `Сіз <strong>${sessionQuestions.length}</strong> сұрақтың <strong>${score}</strong> сұрағына дұрыс жауап бердіңіз.`)}</p>
                <button class="next-btn" style="width: 100%;" onclick="startQuiz(${currentLimit})">${JP.t(`Пройти тест заново`, `Тестті қайта тапсыру`)}</button>
            </div>`;
            return;
        }

        statsCounter.textContent = JP.t(`Вопрос ${currentIndex + 1} из ${sessionQuestions.length}`, `Сұрақ ${currentIndex + 1} / ${sessionQuestions.length}`);
        const q = sessionQuestions[currentIndex];

        const card = document.createElement("div");
        card.className = "question-card";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = q.meta;
        card.appendChild(meta);

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `${currentIndex + 1}. ${q.question}`;
        card.appendChild(title);

        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        q.options.forEach((opt, optIndex) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt;
            btn.onclick = () => {
                const buttons = optionsDiv.children;
                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].classList.remove("selected");
                }
                btn.classList.add("selected");
                selectedOptionIndex = optIndex;
                document.getElementById("checkBtn").disabled = false;
            };
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);

        const explanationBox = document.createElement("div");
        explanationBox.className = "explanation-box";
        explanationBox.innerHTML = `
            <div class="explanation-title">${JP.t(`Объяснение:`, `Түсіндірме:`)}</div>
            <div>${q.explanation}</div>
        `;
        card.appendChild(explanationBox);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const checkBtn = document.createElement("button");
        checkBtn.id = "checkBtn";
        checkBtn.className = "check-btn";
        checkBtn.disabled = true;
        checkBtn.textContent = JP.t("Проверить ответ", "Жауапты тексеру");
        checkBtn.onclick = () => {
            const buttons = optionsDiv.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }
            if (selectedOptionIndex === q.correct) {
                buttons[selectedOptionIndex].classList.add("correct");
                score++;
            } else {
                buttons[selectedOptionIndex].classList.add("wrong");
                buttons[q.correct].classList.add("correct");
            }

            explanationBox.classList.add("visible");

            actionRow.innerHTML = "";
            const nextBtn = document.createElement("button");
            nextBtn.className = "next-btn";
            nextBtn.textContent = currentIndex === sessionQuestions.length - 1 ? JP.t("Посмотреть результат", "Нәтижені көру") : JP.t("Следующий вопрос", "Келесі сұрақ");
            nextBtn.onclick = () => {
                currentIndex++;
                renderQuestion();
            };
            actionRow.appendChild(nextBtn);
        };

        actionRow.appendChild(checkBtn);
        card.appendChild(actionRow);
        container.appendChild(card);
    }
</script>

</body>
</html>
