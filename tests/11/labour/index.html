    let sessionQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentLimit = 20;
    let selectedOptionIndex = null;

    window.startQuiz = function(limit) {
        currentLimit = limit;
        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("quizSession").style.display = "block";
        
        let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
        sessionQuestions = shuffled.slice(0, Math.min(limit, allQuestions.length));
        currentIndex = 0;
        score = 0;
        renderQuestion();
    }

    window.returnToMenu = function() {
        document.getElementById("quizSession").style.display = "none";
        document.getElementById("menuScreen").style.display = "grid";
    }

    async function saveTestAttempt(score, maxScore) {
        const user = auth.currentUser;
        if (!user) return; 

        try {
            await addDoc(collection(db, "attempts"), {
                userId: user.uid,
                title: `Трудовое право РК (11 класс) [${maxScore} вопр.]`,
                score: score,
                maxScore: maxScore,
                createdAt: new Date().toLocaleDateString("ru-RU")
            });
        } catch (e) {
            console.error("Ошибка при сохранении результата: ", e);
        }
    }

    function renderQuestion() {
        const container = document.getElementById("quizContainer");
        const statsCounter = document.getElementById("statsCounter");
        const progressBarFill = document.getElementById("progressBarFill");
        selectedOptionIndex = null;
        
        container.innerHTML = "";

        const progressPercent = (currentIndex / sessionQuestions.length) * 100;
        progressBarFill.style.width = `${progressPercent}%`;

        if (currentIndex >= sessionQuestions.length) {
            statsCounter.textContent = JP.t("Тест завершен!", "Тест аяқталды!");
            progressBarFill.style.width = "100%";
            
            saveTestAttempt(score, sessionQuestions.length);

            container.innerHTML = `<div class="question-card" style="text-align: center;">
                <h2 style="margin-bottom: 12px; color: var(--primary);">${JP.t(`Результаты теста`, `Тест нәтижелері`)}</h2>
                <p style="margin-bottom: 24px; color: var(--muted);">${JP.t(`Вы правильно ответили на <strong>${score}</strong> из <strong>${sessionQuestions.length}</strong> вопросов.`, `Сіз <strong>${sessionQuestions.length}</strong> сұрақтың <strong>${score}</strong> сұрағына дұрыс жауап бердіңіз.`)}</p>
                <button class="next-btn" style="width: 100%;" onclick="startQuiz(${currentLimit})">${JP.t(`Пройти тест заново`, `Тестті қайта тапсыру`)}</button>
            </div>`;
            return;
        }

        statsCounter.textContent = JP.t(`Вопрос ${currentIndex + 1} из ${sessionQuestions.length}`, `Сұрақ ${currentIndex + 1} / ${sessionQuestions.length}`);
        const q = sessionQuestions[currentIndex];

        const card = document.createElement("div");
        card.className = "question-card";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = q.meta;
        card.appendChild(meta);

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `${currentIndex + 1}. ${q.question}`;
        card.appendChild(title);

        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        q.options.forEach((opt, optIndex) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt;
            btn.onclick = () => {
                const buttons = optionsDiv.children;
                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].classList.remove("selected");
                }
                btn.classList.add("selected");
                selectedOptionIndex = optIndex;
                document.getElementById("checkBtn").disabled = false;
            };
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);

        const explanationBox = document.createElement("div");
        explanationBox.className = "explanation-box";
        explanationBox.innerHTML = `
            <div class="explanation-title">${JP.t(`📖 Объяснение нормы права (Трудовой кодекс РК):`, `📖 Құқық нормасының түсіндірмесі (ҚР Еңбек кодексі):`)}</div>
            <div>${q.explanation}</div>
        `;
        card.appendChild(explanationBox);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const checkBtn = document.createElement("button");
        checkBtn.id = "checkBtn";
        checkBtn.className = "check-btn";
        checkBtn.disabled = true;
        checkBtn.textContent = JP.t("Проверить ответ", "Жауапты тексеру");
        checkBtn.onclick = () => {
            const buttons = optionsDiv.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }
            if (selectedOptionIndex === q.correct) {
                buttons[selectedOptionIndex].classList.add("correct");
                score++;
            } else {
                buttons[selectedOptionIndex].classList.add("wrong");
                buttons[q.correct].classList.add("correct");
            }

            explanationBox.classList.add("visible");

            actionRow.innerHTML = "";
            const nextBtn = document.createElement("button");
            nextBtn.className = "next-btn";
            nextBtn.textContent = currentIndex === sessionQuestions.length - 1 ? JP.t("Посмотреть результат", "Нәтижені көру") : JP.t("Следующий вопрос →", "Келесі сұрақ →");
            nextBtn.onclick = () => {
                currentIndex++;
                renderQuestion();
            };
            actionRow.appendChild(nextBtn);
        };

        actionRow.appendChild(checkBtn);
        card.appendChild(actionRow);
        container.appendChild(card);
    }
</script>
