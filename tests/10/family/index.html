                "B) разрешается проведение экспериментов с участием ребенка, если они направлены на достижение научно значимых результатов и осуществляются под контролем квалифицированных специалистов;",
                "C) не запрещаются любые научные опыты или иные эксперименты с участием ребенка;",
                "D) запрещаются любые научные опыты или иные эксперименты с ребенком, если они наносят вред его жизни, здоровью, а также нормальному физическому и психическому развитию, независимо от согласия участников;",
                "E) допускается проведение экспериментальных исследований с участием ребенка при условии минимального риска и последующей компенсации возможного вреда."
            ],
            correct: 3,
            explanation: "Согласно законодательству Республики Казахстан о защите прав ребенка и Кодексу о браке (супружестве) и семье, категорически запрещаются любые научные опыты или эксперименты с ребенком, если они наносят вред его жизни, здоровью или развитию."
        },
        {
            meta: "Год: 2026 | Заключительный этап | 10 класс",
            question: "Какое из нижеперечисленных положений наиболее точно отражает правовую норму, касающуюся участия ребенка в расходах по содержанию семьи?",
            options: [
                "A) Ребенок, получающий доходы от собственного труда, обязан участвовать в расходах по содержанию семьи в обязательном порядке, независимо от условий его проживания и волеизъявления;",
                "B) Ребенок вправе участвовать в расходах семьи исключительно при наличии специального соглашения, удостоверенного нотариально;",
                "C) Ребенок, получающий доходы с собственного труда, вправе участвовать в расходах по содержанию семьи при условии проживания совместно с родителями;",
                "D) Ребенок вправе участвовать в расходах семьи только при наличии письменного согласия органов опеки и попечительства;",
                "E) Участие ребенка в расходах семьи допускается исключительно после достижения им совершеннолетия."
            ],
            correct: 2,
            explanation: "Согласно ст. 82 Кодекса РК «О браке (супружестве) и семье», ребенок, получающий доходы от собственного труда, вправе участвовать в расходах по содержанию семьи при условии проживания совместно с родителями."
        }
    ];

    let sessionQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentLimit = 12;
    let selectedOptionIndex = null;

    window.startQuiz = function(limit) {
        currentLimit = limit;
        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("quizSession").style.display = "block";
        
        let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
        sessionQuestions = shuffled.slice(0, Math.min(limit, allQuestions.length));
        currentIndex = 0;
        score = 0;
        renderQuestion();
    }

    window.returnToMenu = function() {
        document.getElementById("quizSession").style.display = "none";
        document.getElementById("menuScreen").style.display = "grid";
    }

    async function saveTestAttempt(score, maxScore) {
        const user = auth.currentUser;
        if (!user) return; 

        try {
            await addDoc(collection(db, "attempts"), {
                userId: user.uid,
                title: `Семейное право РК (10 класс) [${maxScore} вопр.]`,
                score: score,
                maxScore: maxScore,
                createdAt: new Date().toLocaleDateString("ru-RU")
            });
        } catch (e) {
            console.error("Ошибка при сохранении результата: ", e);
        }
    }

    function renderQuestion() {
        const container = document.getElementById("quizContainer");
        const statsCounter = document.getElementById("statsCounter");
        const progressBarFill = document.getElementById("progressBarFill");
        selectedOptionIndex = null;
        
        container.innerHTML = "";

        const progressPercent = (currentIndex / sessionQuestions.length) * 100;
        progressBarFill.style.width = `${progressPercent}%`;

        if (currentIndex >= sessionQuestions.length) {
            statsCounter.textContent = "Тест завершен!";
            progressBarFill.style.width = "100%";
            
            saveTestAttempt(score, sessionQuestions.length);

            container.innerHTML = `<div class="question-card" style="text-align: center;">
                <h2 style="margin-bottom: 12px; color: var(--primary);">Результаты теста</h2>
                <p style="margin-bottom: 24px; color: var(--muted);">Вы правильно ответили на <strong>${score}</strong> из <strong>${sessionQuestions.length}</strong> вопросов.</p>
                <button class="next-btn" style="width: 100%;" onclick="startQuiz(${currentLimit})">Пройти тест заново</button>
            </div>`;
            return;
        }

        statsCounter.textContent = `Вопрос ${currentIndex + 1} из ${sessionQuestions.length}`;
        const q = sessionQuestions[currentIndex];

        const card = document.createElement("div");
        card.className = "question-card";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = q.meta;
        card.appendChild(meta);

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `${currentIndex + 1}. ${q.question}`;
        card.appendChild(title);

        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        q.options.forEach((opt, optIndex) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt;
            btn.onclick = () => {
                const buttons = optionsDiv.children;
                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].classList.remove("selected");
                }
                btn.classList.add("selected");
                selectedOptionIndex = optIndex;
                document.getElementById("checkBtn").disabled = false;
            };
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);

        const explanationBox = document.createElement("div");
        explanationBox.className = "explanation-box";
        explanationBox.innerHTML = `
            <div class="explanation-title">📖 Объяснение нормы права:</div>
            <div>${q.explanation}</div>
        `;
        card.appendChild(explanationBox);

        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        const checkBtn = document.createElement("button");
        checkBtn.id = "checkBtn";
        checkBtn.className = "check-btn";
        checkBtn.disabled = true;
        checkBtn.textContent = "Проверить ответ";
        checkBtn.onclick = () => {
            const buttons = optionsDiv.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }
            if (selectedOptionIndex === q.correct) {
                buttons[selectedOptionIndex].classList.add("correct");
                score++;
            } else {
                buttons[selectedOptionIndex].classList.add("wrong");
                buttons[q.correct].classList.add("correct");
            }

            explanationBox.classList.add("visible");

            actionRow.innerHTML = "";
            const nextBtn = document.createElement("button");
            nextBtn.className = "next-btn";
            nextBtn.textContent = currentIndex === sessionQuestions.length - 1 ? "Посмотреть результат" : "Следующий вопрос →";
            nextBtn.onclick = () => {
                currentIndex++;
                renderQuestion();
            };
            actionRow.appendChild(nextBtn);
        };

        actionRow.appendChild(checkBtn);
        card.appendChild(actionRow);
        container.appendChild(card);
    }
</script>
