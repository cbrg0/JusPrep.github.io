<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль — JusPrep</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="header container">
    <div class="logo">
      <a href="index.html" style="color:white; text-decoration:none;">JusPrep</a>
    </div>

    <nav class="nav">
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="materials.html">Материалы</a></li>
        <li><a href="materials-cases.html">НПА & кейсы</a></li>
        <li><a href="quizzes.html">Викторины</a></li>
        <li><a href="tests.html">Олимпиадные задания</a></li>
        <li><a href="news.html">Новости</a></li>
        <li><a href="profile.html" class="active">Профиль</a></li>
      </ul>
    </nav>
  </header>

  <main class="container profile-container">
    <section id="profileSection">
      <h1><i class="fas fa-user-circle"></i> My Olympiad Practice</h1>

      <div id="notLoggedIn" class="profile-message">
        <p>Вы не авторизованы.</p>
        <a href="index.html" class="btn">Войти</a>
      </div>

      <div id="userProfile" class="profile-content" style="display:none;">
        <div class="profile-top">
          <div>
            <p class="profile-label">Аккаунт</p>
            <h2 id="userEmail"></h2>
          </div>

          <button id="logoutBtn" class="btn logout-btn">
            <i class="fas fa-sign-out-alt"></i> Выйти
          </button>
        </div>

        <div class="stats">
          <h3>Practice Tests</h3>

          <div id="attemptsList">
            <p>Пока нет сохранённых попыток.</p>
          </div>

          <h3>Written Stage</h3>

          <div id="writtenList">
            <p>Пока нет отправленных письменных работ.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer container">
    <p>© 2025 JusPrep</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxECtixerAiOZAntZqdk9OLAiwC3-xvI8",
      authDomain: "jusprep-e9ad2.firebaseapp.com",
      projectId: "jusprep-e9ad2",
      storageBucket: "jusprep-e9ad2.firebasestorage.app",
      messagingSenderId: "832094265855",
      appId: "1:832094265855:web:df390cb36037d457a687ca",
      measurementId: "G-GY291N2ZQS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const notLoggedIn = document.getElementById("notLoggedIn");
    const userProfile = document.getElementById("userProfile");
    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const attemptsList = document.getElementById("attemptsList");
    const writtenList = document.getElementById("writtenList");

    async function loadAttempts(userId) {
      const q = query(
        collection(db, "attempts"),
        where("userId", "==", userId),
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        attemptsList.innerHTML = "<p>Пока нет сохранённых попыток.</p>";
        return;
      }

      attemptsList.innerHTML = "";

      snapshot.forEach((docItem) => {
        const data = docItem.data();

        const card = document.createElement("div");
        card.className = "practice-card";

        card.innerHTML = `
          <h4>${data.title || "Practice Test"}</h4>
          <p><strong>${data.score}</strong> / ${data.maxScore}</p>
          <small>${data.createdAt || ""}</small>
        `;

        attemptsList.appendChild(card);
      });
    }

    async function loadWritten(userId) {
      const q = query(
        collection(db, "writtenSubmissions"),
        where("userId", "==", userId),
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        writtenList.innerHTML = "<p>Пока нет отправленных письменных работ.</p>";
        return;
      }

      writtenList.innerHTML = "";

      snapshot.forEach((docItem) => {
        const data = docItem.data();

        const card = document.createElement("div");
        card.className = "practice-card";

        card.innerHTML = `
          <h4>${data.title || "Written Task"}</h4>
          <p>${data.status || "Submitted"}</p>
          <small>${data.createdAt || ""}</small>
        `;

        writtenList.appendChild(card);
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        notLoggedIn.style.display = "none";
        userProfile.style.display = "block";
        userEmail.textContent = user.email;

        await loadAttempts(user.uid);
        await loadWritten(user.uid);
      } else {
        notLoggedIn.style.display = "block";
        userProfile.style.display = "none";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      alert("Вы вышли из аккаунта.");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
