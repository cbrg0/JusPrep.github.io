<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JusPrep — Личный кабинет</title>
    <!-- Подключение шрифта Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --primary: #1e3a8a;
            --primary-light: #eff6ff;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #3b82f6;
            --success: #10B981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Шапка / Профиль */
        .header-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            color: white;
            display: grid;
            place-items: center;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
        }

        .user-details h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .user-details p {
            color: var(--muted);
            font-size: 14px;
        }

        .back-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* Метрики */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02);
        }

        .stat-card .title {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }

        /* Карточки аналитики и календаря */
        .card-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 32px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02);
        }

        .card-box h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--primary);
        }

        /* Блок анализа тем */
        .topics-analysis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .topic-group h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .topic-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .topic-badge.success { border-left: 4px solid var(--success); }
        .topic-badge.warning { border-left: 4px solid var(--warning); }
        .topic-badge.danger { border-left: 4px solid var(--danger); }

        /* Календарь активности */
        .calendar-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, 14px);
            grid-auto-flow: column;
            gap: 6px;
        }

        .day-cell {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            background-color: #f1f5f9;
            transition: transform 0.2s;
        }

        .day-cell:hover {
            transform: scale(1.25);
            cursor: pointer;
        }

        .day-cell.level-1 { background-color: #99f6e4; }
        .day-cell.level-2 { background-color: #2dd4bf; }
        .day-cell.level-3 { background-color: #0284c7; }
        .day-cell.level-4 { background-color: #1e3a8a; }

        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            justify-content: flex-end;
        }

        .legend-scale {
            display: flex;
            gap: 4px;
        }

        /* История попыток */
        .attempts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .attempt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .attempt-info .test-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .attempt-info .test-date {
            font-size: 12px;
            color: var(--muted);
        }

        .attempt-score {
            font-weight: 800;
            font-size: 15px;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 14px;
            border-radius: 10px;
        }

        .no-data {
            text-align: center;
            color: var(--muted);
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка профиля -->
        <div class="header-card">
            <div class="user-info">
                <div class="avatar" id="user-avatar-initials">U</div>
                <div class="user-details">
                    <h1 id="user-display-name">Загрузка...</h1>
                    <p>Личный кабинет участника</p>
                </div>
            </div>
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> На главную
            </a>
        </div>

        <!-- Метрики -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="title">Пройдено тестов</div>
                <div class="value" id="stat-tests-count">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Средний балл</div>
                <div class="value" id="stat-avg-score">0%</div>
            </div>
        </div>

        <!-- Анализ сильных и слабых тем (Настоящий алгоритм) -->
        <div class="card-box">
            <h2>Анализ знаний по темам</h2>
            <div class="topics-analysis" id="topics-analysis-container">
                <div class="no-data">Недостаточно данных для анализа тем. Пройдите больше тестов.</div>
            </div>
        </div>

        <!-- Календарь активности -->
        <div class="card-box">
            <h2>Активность занятий</h2>
            <div class="calendar-container">
                <div class="heatmap-grid" id="heatmapGrid"></div>
                <div class="heatmap-legend">
                    <span>Меньше</span>
                    <div class="legend-scale">
                        <span class="day-cell"></span>
                        <span class="day-cell level-1"></span>
                        <span class="day-cell level-2"></span>
                        <span class="day-cell level-3"></span>
                        <span class="day-cell level-4"></span>
                    </div>
                    <span>Больше</span>
                </div>
            </div>
        </div>

        <!-- История прохождений -->
        <div class="card-box">
            <h2>История прохождений</h2>
            <div class="attempts-list" id="attempts-container">
                <div class="no-data">Загрузка результатов...</div>
            </div>
        </div>
    </div>

    <!-- Скрипт Firebase и логика алгоритмов -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxECtixerAiOZAntZqdk9OLAiwC3-xvI8",
            authDomain: "jusprep-e9ad2.firebaseapp.com",
            projectId: "jusprep-e9ad2",
            storageBucket: "jusprep-e9ad2.firebasestorage.app",
            messagingSenderId: "832094265855",
            appId: "1:832094265855:web:df390cb36037d457a687ca"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Алгоритм анализа тем по реальным данным попыток
        function analyzeTopics(attempts) {
            const topicStats = {};

            attempts.forEach(attempt => {
                // Если в объекте попытки сохранена детализация по темам (topicsBreakdown)
                if (attempt.topicsBreakdown) {
                    for (const [topic, data] of Object.entries(attempt.topicsBreakdown)) {
                        if (!topicStats[topic]) topicStats[topic] = { correct: 0, total: 0 };
                        topicStats[topic].correct += data.correct || 0;
                        topicStats[topic].total += data.total || 0;
                    }
                }
            });

            const container = document.getElementById('topics-analysis-container');
            const topicsKeys = Object.keys(topicStats);

            if (topicsKeys.length === 0) {
                // Если тесты пока сохраняются без детализации тем, выводим общую заглушку
                container.innerHTML = '<div class="no-data" style="grid-column: 1/-1;">Пройдите тесты с поддержкой тегов тем для построения глубокой аналитики.</div>';
                return;
            }

            let strongTopics = [];
            let mediumTopics = [];
            let weakTopics = [];

            topicsKeys.forEach(topic => {
                const stat = topicStats[topic];
                const percentage = Math.round((stat.correct / stat.total) * 100);
                
                const item = { name: topic, percent: percentage };
                if (percentage >= 85) strongTopics.push(item);
                else if (percentage >= 60) mediumTopics.push(item);
                else weakTopics.push(item);
            });

            let html = `
                <div class="topic-group">
                    <h3><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i> Зона риска (&lt;60%)</h3>
                    <div class="topic-list">
                        ${weakTopics.length ? weakTopics.map(t => `<div class="topic-badge danger"><span>${t.name}</span><span>${t.percent}%</span></div>`).join('') : '<div class="no-data" style="padding:10px;font-size:13px;">Нет слабых тем! Отлично 🎉</div>'}
                    </div>
                </div>
                <div class="topic-group">
                    <h3><i class="fa-solid fa-shield-halved" style="color:var(--warning)"></i> Стабильно (60–84%)</h3>
                    <div class="topic-list">
                        ${mediumTopics.length ? mediumTopics.map(t => `<div class="topic-badge warning"><span>${t.name}</span><span>${t.percent}%</span></div>`).join('') : '<div class="no-data" style="padding:10px;font-size:13px;">Нет тем в этой зоне</div>'}
                    </div>
                </div>
                <div class="topic-group">
                    <h3><i class="fa-solid fa-circle-check" style="color:var(--success)"></i> Зона уверенности (&ge;85%)</h3>
                    <div class="topic-list">
                        ${strongTopics.length ? strongTopics.map(t => `<div class="topic-badge success"><span>${t.name}</span><span>${t.percent}%</span></div>`).join('') : '<div class="no-data" style="padding:10px;font-size:13px;">Пока нет закрепленных тем</div>'}
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // Алгоритм генерации календаря активности
        function renderActivityCalendar(attemptsData) {
            const gridContainer = document.getElementById('heatmapGrid');
            gridContainer.innerHTML = '';

            const activityCounts = {};
            attemptsData.forEach(attempt => {
                if (attempt.createdAt) {
                    const dateObj = typeof attempt.createdAt.toDate === 'function' 
                        ? attempt.createdAt.toDate() 
                        : new Date(attempt.createdAt);
                    
                    const dateStr = dateObj.toISOString().split('T')[0];
                    activityCounts[dateStr] = (activityCounts[dateStr] || 0) + 1;
                }
            });

            const today = new Date();
            for (let i = 98; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                
                const count = activityCounts[dateStr] || 0;
                
                let levelClass = '';
                if (count === 1) levelClass = 'level-1';
                else if (count === 2) levelClass = 'level-2';
                else if (count === 3) levelClass = 'level-3';
                else if (count > 3) levelClass = 'level-4';

                const cell = document.createElement('div');
                cell.className = `day-cell ${levelClass}`;
                cell.title = `${dateStr}: пройдено тестов: ${count}`;
                
                gridContainer.appendChild(cell);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const name = user.displayName || user.email.split("@")[0];
            document.getElementById('user-display-name').textContent = name;
            document.getElementById('user-avatar-initials').textContent = name.charAt(0).toUpperCase();

            const container = document.getElementById('attempts-container');

            try {
                const querySnapshot = await getDocs(collection(db, "attempts"));
                let userAttempts = [];

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.userId === user.uid) {
                        userAttempts.push(data);
                    }
                });

                userAttempts.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                let totalScore = 0;
                let count = userAttempts.length;
                let attemptsHTML = '';

                userAttempts.forEach((data) => {
                    totalScore += data.percentage || 0;
                    
                    let dateFormatted = 'Недавно';
                    if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                        dateFormatted = data.createdAt.toDate().toLocaleDateString('ru-RU');
                    }

                    attemptsHTML += `
                        <div class="attempt-item">
                            <div class="attempt-info">
                                <div class="test-title">${data.testTitle || 'Тест по праву РК'}</div>
                                <div class="test-date">${dateFormatted}</div>
                            </div>
                            <div class="attempt-score">${data.score || 0} / ${data.total || 0} (${data.percentage || 0}%)</div>
                        </div>
                    `;
                });

                if (count > 0) {
                    document.getElementById('stat-tests-count').innerText = count;
                    document.getElementById('stat-avg-score').innerText = Math.round(totalScore / count) + '%';
                    container.innerHTML = attemptsHTML;
                } else {
                    container.innerHTML = '<div class="no-data">Вы еще не прошли ни одного теста.</div>';
                }

                // Запуск аналитических алгоритмов на реальных данных
                renderActivityCalendar(userAttempts);
                analyzeTopics(userAttempts);

            } catch (error) {
                console.error("Ошибка загрузки истории: ", error);
                container.innerHTML = `<div class="no-data">Ошибка загрузки: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
