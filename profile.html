<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JusPrep — Профиль пользователя</title>
    <!-- Подключение шрифта Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Иконки FontAwesome для интерфейса -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Навигация / Шапка профиля */
        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }

        .user-details h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .user-details p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--bg);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        /* Сетка статистики */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .stat-card .title {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        /* История попыток тестов */
        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .history-card h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .attempts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .attempt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .attempt-info .test-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .attempt-info .test-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .attempt-score {
            font-weight: 700;
            font-size: 16px;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка профиля -->
        <div class="header-card">
            <div class="user-info">
                <div class="avatar" id="user-avatar-initials">JP</div>
                <div class="user-details">
                    <h1 id="user-display-name">Студент JusPrep</h1>
                    <p>Платформа подготовки по праву РК</p>
                </div>
            </div>
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> На главную
            </a>
        </div>

        <!-- Метрики и статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="title">Пройдено тестов</div>
                <div class="value" id="stat-tests-count">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Средний балл</div>
                <div class="value" id="stat-avg-score">0%</div>
            </div>
            <div class="stat-card">
                <div class="title">Дней активности</div>
                <div class="value" id="stat-active-days">0</div>
            </div>
        </div>

        <!-- История попыток -->
        <div class="history-card">
            <h2>История прохождений</h2>
            <div class="attempts-list" id="attempts-container">
                <div class="no-data">Загрузка результатов...</div>
            </div>
        </div>
    </div>

</body>
</html>
